<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- [v1.0.5.7] CSP：'unsafe-inline'/'unsafe-eval' 为插件沙箱（srcdoc/new Function）所必需 -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https:; font-src 'self' data: file:; connect-src 'self' https: ws: wss:; media-src 'self' file: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Digital Clock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-plugin-hook="clock.infoBar">
  <div id="clock" class="clock">
    <div id="time-display"></div>
    <div id="info-bar" class="info-bar">
      <span id="date-inline"></span>
      <span id="weekday-inline"></span>
      <span id="tz-inline"></span>
      <span id="countdown-inline"></span>
      <span id="alarm-inline"></span>
    </div>
  </div>
  <script src="renderer.js"></script>
  <script src="plugin-host.js"></script>
</body>
</html>
