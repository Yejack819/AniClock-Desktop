<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- [v1.0.5.7] CSP：'unsafe-inline'/'unsafe-eval' 为插件沙箱（srcdoc/new Function）所必需 -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: https:; font-src 'self' data: file:; connect-src 'self' https: ws: wss:; media-src 'self' file: blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>关灯</title>
  <link rel="stylesheet" href="lights-off.css">
</head>
<body data-plugin-hook="lightsOff.background">
  <!-- [v1.0.5.5] 插件背景层：在宿主底色之上、内容与控件之下；由声明了 ui.lightsOffBg 的插件支配 -->
  <div id="plugin-bg-layer"></div>
  <div id="hint" data-lang="hint">移动鼠标显示按钮 · 双击背景或按 ESC 退出</div>
  <div id="controls">
    <button id="btn-settings" data-lang="settings">⚙️ 设置</button>
    <button id="btn-exit" data-lang="exit">✖️ 退出</button>
  </div>
  <!-- [v1.0.6] 右下角锁定按钮：锁定时仅退出按钮可退出 -->
  <button id="btn-lock" title="">🔓 未锁定</button>
  <!-- [v1.0.5.5] 插件层：需在页面脚本之后加载 -->
  <div id="plugin-layer"></div>
  <script src="lights-off.js"></script>
  <script src="plugin-host.js"></script>
</body>
</html>
