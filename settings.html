<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="CSP" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title data-lang="settingsTitle">时钟设置</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-window">
    <h3 data-lang="settingsHeader">时钟设置</h3>

    <!-- ====== [v1.0.5] 模式 ====== -->
    <div class="section-title" data-lang="secMode">--- 模式 ---</div>

    <div class="setting-row">
      <label data-lang="modeLabel">模式</label>
      <select id="mode-select">
        <option value="normal" data-lang="modeNormal">正常模式</option>
        <option value="education" data-lang="modeEducation">教育模式</option>
      </select>
    </div>

    <div class="setting-row">
      <label data-lang="lightsOff">关灯（全屏纯色背景）</label>
      <label class="toggle-switch">
        <input type="checkbox" id="lights-off-switch">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- ====== 外观 ====== -->
    <div class="section-title" data-lang="secAppearance">--- 外观 ---</div>

    <div class="setting-row edu-hide">
      <label data-lang="fontFamily">字体</label>
      <select id="font-select">
        <option value="Arial">Arial</option>
        <option value="Georgia">Georgia</option>
        <option value="Microsoft YaHei">Microsoft YaHei</option>
        <option value="Courier New">Courier New</option>
        <option value="Inter">Inter</option>
        <option value="custom" data-lang="customFont">自定义...</option>
      </select>
      <input type="text" id="font-custom" class="custom-input hidden" placeholder="">
    </div>

    <div class="setting-row">
      <label><span data-lang="fontSize">字号</span> <span id="font-size-label">200</span>px</label>
      <input type="range" id="font-size" min="40" max="400" value="200">
    </div>

    <div class="setting-row edu-hide">
      <label><span data-lang="infoScale">日期/时区比例</span> <span id="info-scale-label">0.30</span></label>
      <input type="range" id="info-scale" min="0.10" max="1.00" step="0.01" value="0.30">
    </div>

    <div class="setting-row">
      <label data-lang="textColor">文本颜色</label>
      <input type="color" id="text-color" value="#ffffff">
    </div>

    <div class="setting-row">
      <label data-lang="bgColor">背景颜色</label>
      <div class="bg-row">
        <input type="color" id="bg-color" value="#000000">
        <label class="sub-label" data-lang="alpha">透明度</label>
        <input type="range" id="bg-alpha" min="0" max="1" step="0.05" value="0">
        <span id="bg-alpha-label">0%</span>
      </div>
    </div>

    <div class="setting-row">
      <label data-lang="autoColor">根据白天/黑夜自动切换黑白</label>
      <label class="toggle-switch">
        <input type="checkbox" id="auto-color">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- ====== 动画 ====== -->
    <div class="section-title edu-hide" data-lang="secAnimation">--- 动画 ---</div>

    <div class="setting-row edu-hide">
      <label data-lang="animType">动画效果</label>
      <select id="anim-type">
        <option value="slide-up" data-lang="animSlideUp">上滑翻转</option>
        <option value="slide-down" data-lang="animSlideDown">下滑翻转</option>
        <option value="fade" data-lang="animFade">淡入淡出</option>
        <option value="shrink" data-lang="animShrink">缩（旧变小）</option>
        <option value="expand" data-lang="animExpand">放（旧变大）</option>
        <option value="flip-3d" data-lang="animFlip3d">3D旋转</option>
        <option value="none" data-lang="animNone">无动画</option>
      </select>
    </div>

    <div class="setting-row edu-hide">
      <label data-lang="animSpeed">动画速度 <span id="anim-speed-label">350</span>ms</label>
      <input type="range" id="anim-speed" min="50" max="1000" step="10" value="350">
    </div>

    <div class="setting-row edu-hide">
      <label><span data-lang="staggerDelay">错峰延迟</span> <span id="stagger-delay-label">0</span>ms</label>
      <input type="range" id="stagger-delay" min="0" max="300" step="10" value="0">
    </div>

    <div class="setting-row edu-hide">
      <label data-lang="staggerDir">错峰方向</label>
      <select id="stagger-dir">
        <option value="ltr" data-lang="staggerLTR">从左到右</option>
        <option value="rtl" data-lang="staggerRTL">从右到左</option>
      </select>
    </div>

    <div class="setting-row blur-controls hidden edu-hide" id="blur-controls">
      <label><span data-lang="blurEnabled">添加模糊</span>
        <label class="toggle-switch" style="margin-left:6px">
          <input type="checkbox" id="blur-enabled">
          <span class="toggle-slider"></span>
        </label>
      </label>
    </div>

    <div class="blur-detail hidden edu-hide" id="blur-detail">
      <div class="setting-row">
        <label><span data-lang="blurDuration">模糊持续</span> <span id="blur-duration-label">300</span>ms</label>
        <input type="range" id="blur-duration" min="10" max="1000" step="10" value="300">
      </div>
      <div class="setting-row">
        <label><span data-lang="blurStrength">模糊强度</span> <span id="blur-strength-label">15</span>px</label>
        <input type="range" id="blur-strength" min="1" max="40" step="1" value="15">
      </div>
    </div>

    <div class="setting-row scale-controls hidden edu-hide" id="scale-controls">
      <label><span data-lang="scaleInEnabled">由小放大滑入</span>
        <label class="toggle-switch" style="margin-left:6px">
          <input type="checkbox" id="scale-in-enabled">
          <span class="toggle-slider"></span>
        </label>
      </label>
    </div>

    <div class="scale-detail hidden edu-hide" id="scale-detail">
      <div class="setting-row">
        <label><span data-lang="scaleInFactor">初始大小</span> <span id="scale-factor-label">30</span>%</label>
        <input type="range" id="scale-factor" min="5" max="100" step="1" value="30">
      </div>
    </div>

    <!-- ====== 时间 ====== -->
    <div class="section-title edu-hide" data-lang="secTime">--- 时间 ---</div>

    <div class="setting-row edu-hide">
      <label data-lang="showSeconds">显示秒</label>
      <label class="toggle-switch">
        <input type="checkbox" id="show-seconds" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="setting-row edu-hide">
      <label data-lang="showDate">显示日期</label>
      <label class="toggle-switch">
        <input type="checkbox" id="show-date" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="setting-row edu-hide">
      <label data-lang="showWeekday">显示星期</label>
      <label class="toggle-switch">
        <input type="checkbox" id="show-weekday" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="setting-row edu-hide">
      <label data-lang="datePosition">日期位置</label>
      <select id="date-position">
        <option value="above" data-lang="dateAbove">上方</option>
        <option value="below" data-lang="dateBelow">下方</option>
      </select>
    </div>

    <div id="tz-list" class="edu-hide"></div>
    <div class="tz-add-row edu-hide" id="tz-add-row">
      <input type="text" id="tz-label-input" placeholder="New York">
      <input type="number" id="tz-offset-input" value="0" min="-12" max="14" step="1">
      <span>UTC</span>
      <button id="tz-add-btn">+</button>
    </div>
    <div id="tz-hint" class="tz-hint edu-hide" data-lang="tzHint">最多添加 2 个时区</div>

    <!-- ====== 闹钟 ====== -->
    <div class="section-title edu-hide" data-lang="secAlarm">--- 闹钟 ---</div>

    <div id="alarm-list" class="edu-hide"></div>

    <button id="alarm-add-btn" class="edu-hide" data-lang="alarmAdd">+ 添加闹钟</button>

    <div class="alarm-advanced edu-hide">
      <button id="alarm-advanced-toggle" data-lang="alarmAdvanced">▶ 高级设置</button>
      <div id="alarm-advanced-content" class="hidden">
        <div class="setting-row">
          <label><span data-lang="alarmSoundDuration">声音播放最长时间</span> <span id="alarm-sound-duration-label">120</span>s</label>
          <input type="range" id="alarm-sound-duration" min="5" max="300" step="1" value="120">
        </div>
        <div class="setting-row">
          <label data-lang="alarmFlash">闹钟响时闪烁</label>
          <label class="toggle-switch">
            <input type="checkbox" id="alarm-flash" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <label data-lang="alarmAutoShow">闹钟响时自动取消隐藏</label>
          <label class="toggle-switch">
            <input type="checkbox" id="alarm-auto-show" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <label data-lang="alarmAutoPassthrough">闹钟响时自动关闭鼠标穿透</label>
          <label class="toggle-switch">
            <input type="checkbox" id="alarm-auto-passthrough" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="setting-row">
          <label data-lang="alarmAutoTop">闹钟响时自动置顶</label>
          <label class="toggle-switch">
            <input type="checkbox" id="alarm-auto-top" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- ====== 位置 ====== -->
    <div class="section-title" data-lang="secPosition">--- 位置 ---</div>

    <div class="setting-row">
      <label data-lang="position">窗口位置</label>
      <div class="position-buttons">
        <button data-pos="top-left" data-lang="posTL">左上</button>
        <button data-pos="top-right" data-lang="posTR">右上</button>
        <button data-pos="center" data-lang="posCenter">居中</button>
        <button data-pos="bottom-left" data-lang="posBL">左下</button>
        <button data-pos="bottom-right" data-lang="posBR">右下</button>
        <button data-pos="custom" data-lang="posCustom">自定义</button>
      </div>
    </div>
    <div id="custom-pos-controls" class="custom-pos hidden">
      <label>X: <input type="number" id="pos-x" step="1" value="0"> px</label>
      <label>Y: <input type="number" id="pos-y" step="1" value="0"> px</label>
      <button id="apply-pos" data-lang="applyPos">应用位置</button>
    </div>

    <!-- ====== 系统 ====== -->
    <div class="section-title" data-lang="secSystem">--- 系统 ---</div>

    <div class="setting-row">
      <label data-lang="layerMode">图层模式</label>
      <select id="layer-mode">
        <option value="alwaysOnTop" data-lang="layerTop">置顶</option>
        <option value="normal" data-lang="layerNormal">桌面</option>
      </select>
    </div>

    <div class="setting-row edu-hide">
      <label data-lang="autoStart">开机自启动</label>
      <label class="toggle-switch">
        <input type="checkbox" id="auto-start">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="setting-row edu-hide">
      <label data-lang="language">语言</label>
      <select id="language-select">
        <option value="zh" data-lang="langZh">中文</option>
        <option value="en" data-lang="langEn">English</option>
      </select>
    </div>

    <div class="setting-row">
      <label data-lang="passthrough">鼠标穿透（整个窗口）</label>
      <label class="toggle-switch">
        <input type="checkbox" id="passthrough-switch">
        <span class="toggle-slider"></span>
      </label>
      <div class="passthrough-warning" data-lang="passthroughWarn">开启鼠标穿透后无法拖动窗口以更改其位置</div>
    </div>

    <!-- ====== [v1.0.5] 设置界面尺寸 ====== -->
    <div class="section-title edu-hide" data-lang="secSettingsUI">--- 设置界面 ---</div>

    <div class="setting-row edu-hide">
      <label data-lang="settingsFontSize">设置窗口字体大小</label>
      <select id="settings-font-size">
        <option value="xs" data-lang="fontXs">极小</option>
        <option value="sm" data-lang="fontSm">小</option>
        <option value="md" data-lang="fontMd">中</option>
        <option value="lg" data-lang="fontLg">大</option>
        <option value="xl" data-lang="fontXl">极大</option>
      </select>
    </div>

    <!-- ====== [v1.0.5] 数据管理 ====== -->
    <div class="section-title edu-hide" data-lang="secData">--- 数据管理 ---</div>

    <div class="setting-row edu-hide">
      <label data-lang="deleteDataDesc" style="color:#f88;font-size:12px;line-height:1.5;">删除所有保存的数据（config.json 和 alarms.json），应用将恢复出厂状态。此操作不可撤销！</label>
    </div>
    <button id="delete-data-btn" class="danger-btn edu-hide" data-lang="deleteDataBtn">🗑️ 删除所有保存的数据</button>

  </div>
  <script src="settings.js"></script>
</body>
</html>
