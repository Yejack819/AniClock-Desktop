        <button type="button" id="cd-edit-cancel" hidden>取消编辑</button>
        <button type="submit" class="primary" id="cd-submit">开始</button>
      </div>
    </form>
  </div>
</section>

<script>
(function () {
  'use strict';

  // 与主进程约定的路径；访问码直接取自地址栏，页面不拼任何外部地址
  var API_TAIL = '/api/state';
  var POLL_MS = 15000;

  // [v1.0.5.7] 页面自愈：宿主在发出这份 HTML 时，会把页面文件的 mtime+size 填进下面这个占位符；
  // /api/state 也带同一个值。两者一对不上，说明「手机上跑的是旧页面」（页面在 app 重启/改版前
  // 就打开了，已加载的旧脚本不会自己更新）→ 立刻自动重载，免得又出现「改了不生效」的假 bug。
  // 直接双击打开文件（file://）时占位符不会被替换 → 恒等，永不触发。
  var PAGE_BUILD = '__DC_PAGE_BUILD__';
  var pageReloaded = false;
  // 底部胶囊：平时可见，3 秒没动静自动淡出，屏幕上再有任何操作立刻回来
  var FAB_IDLE_MS = 3000;
  var FAB_LONG_MS = 500; // 长按胶囊 = 打开抽屉（单击 = 进全屏）

  // 手机端本机偏好：只存在这台设备的浏览器里，与宿主配置 / 桌面端完全无关
  var LS_SCALE = 'dc.clockScale';   // 时钟（主界面）字号倍率（百分比整数）
  var LS_FS_SCALE = 'dc.fsScale';   // 全屏倒计时大字倍率（与上面那个相互独立）
  var LS_FS_BLUR = 'dc.fsBlur';     // 全屏倒计时：静止 5 秒后把秒数显示成 --
  var LS_FS_HUE = 'dc.fsHue';       // 全屏水位条色相（0–359），默认 24 ≈ 橙
  // [v1.0.5.7] 主界面时钟的「字体 / 数字动画」本机偏好：与电脑端设置相互独立。
  // 面板里选了「跟随电脑」，该项才回到跟电脑一致（默认就是跟随电脑）。
  var LS_FONT = 'dc.clockFont';      // 'auto'（跟随电脑）| 预设 key | 'custom:<字体名>'
  var LS_ANIM_TYPE = 'dc.animType';  // 'auto' | flip | scale | fade | flip-3d | none
  var LS_ANIM_DIR = 'dc.animDir';    // flip: up|down  ·  scale: shrink|grow
  var LS_ANIM_DUR = 'dc.animDur';    // 动画时长（ms）；空 = 跟随电脑
  // [v1.0.5.7] 数字动画「节奏」（缓动曲线）：'auto' = 跟随电脑，其余同上表
  var LS_ANIM_EASE = 'dc.animEase';  // 'auto' | default | linear | ease-in | ease-out | ease-in-out
  var ANIM_DUR_MIN = 150, ANIM_DUR_MAX = 800, ANIM_DUR_STEP = 50;
  // 节奏档 → CSS 缓动关键字。'default'（弹性）**故意不在表里**：它表示「不写 --anim-ease」，
  // 由 CSS 里各条 transition 的 var() 落到各自的原曲线（翻转/缩放回弹、淡入淡出 ease）。
  // ⚠️ 「不写」必须用 removeProperty 实现：setProperty('--anim-ease','') 会让 var() 取到空值
  //    → 整条 transition 声明失效 → 数字直接跳变、完全没有动画。
  var ANIM_EASE_CSS = {
    'linear': 'linear', 'ease-in': 'ease-in', 'ease-out': 'ease-out', 'ease-in-out': 'ease-in-out'
  };
  var ANIM_EASE_ALL = ['auto', 'default', 'linear', 'ease-in', 'ease-out', 'ease-in-out'];
  // 字体预设：全部是系统自带字体（零外链、零下载），最后一项靠系统里已装的字体名
  var FONT_PRESETS = {
    system: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif',
    sans: '"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif',
    serif: 'Georgia,"Times New Roman","Songti SC","SimSun",serif',
    mono: '"SF Mono",Menlo,Consolas,"Courier New",monospace',
    round: 'ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB",system-ui,sans-serif'
  };
  // ⚠️ 手势从「长按」改成「双击」→ 换一个记忆键，让老用户再看一次提示
  //    （否则他们捏着旧手势，永远不知道要双击）
  var LS_HINT = 'dc.hintSeen.tap';  // 「双击可调字号」提示是否已展示过
  var SCALE_MIN = 60, SCALE_MAX = 150, SCALE_STEP = 10;
  // 双击判定：两次「按下」的间隔与位移上限。判定放在**第二次按下**的瞬间 →
  // 不等抬手，也就不会碰上真机 click 被吞掉那类问题。
  var DOUBLE_TAP_MS = 320, DOUBLE_TAP_DIST = 40;

  // 拿不到快照时的兜底配置：保证页面一打开就有钟走，而不是空白
  var FALLBACK = {
    language: 'zh', color: '#ffffff', bgColor: 'rgba(0,0,0,0)', fontFamily: 'Arial',
    infoScale: 0.3, hourFormat: 'auto', ampmCorner: 'top-right',
    showSeconds: true, showDate: true, showWeekday: true, datePosition: 'below',
    autoColor: false, extraTimezones: [],
    animType: 'flip', animFlipDir: 'up', animScaleDir: 'shrink', animDuration: 350,
    animEase: 'default',
    staggerDelay: 0, staggerDirection: 'ltr',
    timeOffsetMs: 0, autoAdjustEnabled: false, autoAdjustIntervalSec: 3600,
    autoAdjustAmountMs: 0, autoAdjustBaseMs: 0, autoAdjustAnchor: 0,
    countdownDefaultMinutes: 5
  };

  var CFG = FALLBACK;
  var SYNC_MS = 0;            // 服务端时间 - 本机时间（含半程网络延迟补偿）
  var haveRemote = false;
  var online = false, fails = 0;
  var lastKey = null, lastLen = 0, lastInfo = '', colorKey = '', lastAmpm = null;
  // [v1.0.5.7] 数字渲染状态：时钟与全屏大字共用同一套 buildInto/swapIn，各持一份状态
  var clockSt = { ed: [], key: null, len: 0 }, tickTimer = null;

  function el(id) { return document.getElementById(id); }
  function nm(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function tokenPath() {
    // 「不需要访问码」模式下页面就在根路径 /，第一段是空的 →
    // 必须拼成 /api/state 而不是 //api/state（双斜杠会被当成协议相对 URL，主机名变成 api）
    var seg = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '';
    return (seg ? '/' + seg : '') + API_TAIL;
  }
  // 同源 API 基址（带访问码前缀）。倒计时读写都走这里，永远不拼外部主机。
  function apiBase() {
    var seg = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '';
    return seg ? '/' + seg : '';
  }
  function apiPath(tail) { return apiBase() + '/api/' + tail; }

  // ====== 时间：与 renderer.js 同源（手动校准 + 定时自动校准的阶梯累积） ======
  function use12() {
    var f = CFG.hourFormat || '24';
    if (f === '12') return true;
    if (f === '24') return false;
    try {
      var o = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions();
      if (o.hourCycle) return o.hourCycle === 'h11' || o.hourCycle === 'h12';
    } catch (e) { /* ignore */ }
    return false;
  }
  function ampmLabel(h24) { return CFG.language === 'zh' ? (h24 >= 12 ? '下午' : '上午') : (h24 >= 12 ? 'PM' : 'AM'); }
  function clampAuto(v) { return Math.max(-3600000, Math.min(3600000, v)); }
  function autoDelta(nowMs) {
    if (!CFG.autoAdjustEnabled) return 0;
    var iv = Math.max(5, nm(CFG.autoAdjustIntervalSec, 5)) * 1000;
    var am = nm(CFG.autoAdjustAmountMs, 0);
    var bs = nm(CFG.autoAdjustBaseMs, 0);
    if (!am) return clampAuto(bs);
    var an = nm(CFG.autoAdjustAnchor, 0) || nowMs;
    var steps = Math.floor(Math.max(0, nowMs - an) / iv);
    return clampAuto(bs + steps * am);
  }
  function realNow() { return Date.now() + SYNC_MS; }
  function totalOffset() { return nm(CFG.timeOffsetMs, 0) + autoDelta(realNow()); }
  function effNow() { return new Date(realNow() + totalOffset()); }

  function digitsOf(d) {
    var h24 = d.getHours();
    var hh = pad(use12() ? (h24 % 12 || 12) : h24);
    var mm = pad(d.getMinutes());
    var ss = pad(d.getSeconds());
    return (CFG.showSeconds !== false ? hh + mm + ss : hh + mm).split('');
  }
  function fmtDate(d) {
    if (CFG.language === 'zh') return d.getFullYear() + '年' + pad(d.getMonth() + 1) + '月' + pad(d.getDate()) + '日';
    var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return M[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  function weekdayOf(d) {
    try { return new Intl.DateTimeFormat(CFG.language === 'zh' ? 'zh-CN' : 'en-US', { weekday: 'long' }).format(d); }
    catch (e) { return ''; }
  }
  function tzText(d, offset) {
    var h24 = ((d.getUTCHours() + nm(offset, 0)) % 24 + 24) % 24;
    var mm = pad(d.getUTCMinutes());
    if (!use12()) return pad(h24) + ':' + mm;
    return pad(h24 % 12 || 12) + ':' + mm + ' ' + ampmLabel(h24);
  }

  // ====== 渲染 ======
  // [v1.0.5.7] 时钟与全屏大字共用这一套「逐位」渲染：容器挂 anim-<家族> dir-<方向>，
  // 每个数字位是 .digit-group（内含 .digit-current / .digit-next 两层），换位时给两层
  // 分别加 .animate-out / .animate-in → 由 CSS 决定具体的动画家族与方向。两边完全同源。
  function buildInto(box, st, dg) {
    box.innerHTML = '';
    // 冒号插在哪儿：偶数长度（mmss / hhmmss）插在 2、4；**奇数长度**（h:mm:ss 的 5 位）
    // 插在 1、3。原来只按「i % 2 === 0」插 → 5 位会被插成 10:1:01（全屏倒计时
    // 超过 1 小时后走的就是这条分支）。最多两个冒号。
    var odd = dg.length % 2 === 1, ci = 0;
    for (var i = 0; i < dg.length; i++) {
      if (i > 0 && ci < 2 && (odd ? i % 2 === 1 : i % 2 === 0)) {
        var co = document.createElement('span');
        co.className = 'colon'; co.textContent = ':';
        box.appendChild(co); ci++;
      }
      var g = document.createElement('span'); g.className = 'digit-group';
      var a = document.createElement('span'); a.className = 'digit-current'; a.textContent = dg[i];
      var b = document.createElement('span'); b.className = 'digit-next'; b.textContent = dg[i];
      g.appendChild(a); g.appendChild(b); box.appendChild(g);
    }
    st.ed = dg.slice();
  }

  function resetPair(c, n) {
    c.style.transition = n.style.transition = 'none';
    c.classList.remove('animate-out'); n.classList.remove('animate-in');
    c.style.transform = c.style.opacity = n.style.transform = n.style.opacity = '';
    void c.offsetHeight;
    c.style.transition = n.style.transition = '';
  }

  function swapIn(box, st, dg) {
    var groups = box.querySelectorAll('.digit-group');
    var sd = nm(CFG.staggerDelay, 0), rtl = CFG.staggerDirection === 'rtl';
    var AD = animDur();
    for (var i = 0; i < dg.length; i++) {
      if (st.ed[i] === dg[i]) continue;
      var g = groups[i]; if (!g) continue;
      var ce = g.querySelector('.digit-current'), ne = g.querySelector('.digit-next');
      if (!ce || !ne) continue;
      var next = dg[i];
      st.ed[i] = next;
      var delay = sd > 0 ? sd * (rtl ? dg.length - 1 - i : i) : 0;
      if (CFG.animType === 'none') {
        (function (target, val, dl) {
          if (dl > 0) setTimeout(function () { target.textContent = val; }, dl);
          else target.textContent = val;
        })(ce, next, delay);
        continue;
      }
      (function (cur, nxt, val, dl) {
        var go = function () {
          resetPair(cur, nxt);
          nxt.textContent = val;
          cur.classList.add('animate-out');
          nxt.classList.add('animate-in');
          setTimeout(function () { cur.textContent = val; resetPair(cur, nxt); }, AD + 30);
        };
        if (dl > 0) setTimeout(go, dl); else go();
      })(ce, ne, next, delay);
    }
  }
  // 时钟用的薄包装
  function build(dg) { buildInto(el('digits'), clockSt, dg); }
  function swap(dg) { swapIn(el('digits'), clockSt, dg); }

  function renderInfo(now) {
    var bar = el('info-bar'), out = [];
    if (CFG.showDate !== false) out.push('<span>' + esc(fmtDate(now)) + '</span>');
    if (CFG.showWeekday !== false) out.push('<span>' + esc(weekdayOf(now)) + '</span>');
    var tz = (CFG.extraTimezones || []).slice(0, 2);
    for (var i = 0; i < tz.length; i++) {
      out.push('<span>' + esc((tz[i].label ? tz[i].label + ' ' : '') + tzText(now, tz[i].offset)) + '</span>');
    }
    var html = out.join('');
    if (html !== lastInfo) { bar.innerHTML = html; lastInfo = html; }
  }

  function applyColors(now) {
    var fg = CFG.color || '#ffffff';
    var bg = CFG.bgColor || 'rgba(0,0,0,0)';
    var day = false;
    if (CFG.autoColor) {
      var h = now.getHours();
      day = h >= 6 && h < 18;
      var a = 0, m = String(CFG.bgColor || '').match(/rgba\((\d+),\s*(\d+),\s*(\d+),\s*([\d.]+)\)/);
      if (m) a = parseFloat(m[4]);
      if (day) { fg = '#000000'; bg = 'rgba(255,255,255,' + a + ')'; }
      else { fg = '#ffffff'; bg = 'rgba(0,0,0,' + a + ')'; }
    }
    var key = fg + '|' + bg + '|' + day;
    if (key === colorKey) return;
    colorKey = key;
    el('time-display').style.color = fg;
    el('time-display').style.backgroundColor = bg;
    el('info-bar').style.color = fg;
    el('info-bar').style.backgroundColor = bg;
    document.body.classList.toggle('is-day', !!day);
  }

  function applyAmpm(text) {
    if (text === lastAmpm) return;
    lastAmpm = text;
    var node = el('ampm');
    var corner = CFG.ampmCorner || 'top-right';
    if (!text) { node.className = ''; node.textContent = ''; return; }
    node.textContent = text;
    node.className = 'show ' + corner;
    node.style.fontSize = ampmFontPx() + 'px';
  }

  // [v1.0.5.7] 角标字号按**当前**字号算：原来只在文案变化时算一次，且初始化时
  // 用的还是 fit() 探针阶段的旧值，此后窗口缩放再也不更新
  var curPx = 120;
  function ampmFontPx() {
    return Math.max(11, Math.min(30, Math.round(curPx * 0.18)));
  }
  // ---- 本机字号倍率（只影响这台手机，与桌面端的任何设置无关）----
  // lsGet 是函数声明、会提升，所以这里能安全调用，尽管它写在文件更靠后的位置
  function phoneScale() {
    var v = Number(lsGet(LS_SCALE));
    if (!isFinite(v) || v <= 0) return 100;
    return Math.max(SCALE_MIN, Math.min(SCALE_MAX, Math.round(v / SCALE_STEP) * SCALE_STEP));
  }
  function setPhoneScale(v) {
    var n = Math.max(SCALE_MIN, Math.min(SCALE_MAX, Math.round(Number(v) / SCALE_STEP) * SCALE_STEP));
    lsSet(LS_SCALE, String(n));
    return n;
  }

  function fit() {
    var clock = el('clock'), digits = el('digits');
    var probe = 100;
    clock.style.fontSize = probe + 'px'; // ⚠️ 测量必须用基准字号，倍率不能掺进来
    var w = digits.getBoundingClientRect().width || 1;
    var avail = Math.max(140, window.innerWidth - 28);
    var px = probe * (avail / w);
    px = Math.max(30, Math.min(px, Math.round(window.innerHeight * 0.38), 460));
    // [v1.0.5.7] 叠加本机倍率后再夹一次上下限（上限也跟着放宽，否则放大到 150% 会被 460 卡住）
    var sc = phoneScale();
    if (sc !== 100) px = Math.round(px * sc / 100);
    px = Math.max(18, Math.min(px, Math.round(window.innerHeight * 0.62), Math.round(460 * sc / 100)));
    clock.style.fontSize = px + 'px';
    curPx = px;
    // 字号变了立刻同步角标（文案没变时 applyAmpm 不会重算）
    if (lastAmpm) el('ampm').style.fontSize = ampmFontPx() + 'px';
    // 信息栏跟着一起缩放 —— 它的 38px 硬上限也要按倍率放宽，不然放大了信息栏纹丝不动
    var ibMax = Math.round(38 * sc / 100);
    el('info-bar').style.fontSize = Math.max(10, Math.min(ibMax, Math.round(px * nm(CFG.infoScale, 0.3)))) + 'px';
    applyAnimVars(el('time-display'));
  }

  // 「当前动画家族 + 方向」的唯一出处：时钟与全屏大字都从这里取，保证永远一致。
  // [v1.0.5.7] 手机端可以**独立**选动画：本机选了家族就用本机的，选「跟随电脑」才用宿主的。
  var ANIM_AT_ALL = ['auto', 'flip', 'scale', 'fade', 'flip-3d', 'none'];
  var ANIM_AT_DESKTOP = ['flip', 'scale', 'fade', 'flip-3d', 'none'];
  function localAnimType() {
    var v = lsGet(LS_ANIM_TYPE);
    return ANIM_AT_ALL.indexOf(v) >= 0 ? v : 'auto';
  }
  function localAnimDir() {
    var v = lsGet(LS_ANIM_DIR);
    return (v === 'up' || v === 'down' || v === 'shrink' || v === 'grow') ? v : '';
  }
  // 动画时长：本机没设过就跟随电脑。
  // ⚠️ 必须先挡 null / 空串 —— Number(null) === 0（不是 NaN），不挡的话「没设过」
  //    会被读成 0ms（数字直接跳变、完全没有动画）。
  function animDur() {
    var raw = lsGet(LS_ANIM_DUR);
    if (raw === null || raw === '') return nm(CFG.animDuration, 350);
    var n = Number(raw);
    if (!isFinite(n)) return nm(CFG.animDuration, 350);
    return Math.round(Math.max(ANIM_DUR_MIN, Math.min(ANIM_DUR_MAX, n)));
  }
  function setAnimDur(v) {
    var n = Math.round(Number(v) / ANIM_DUR_STEP) * ANIM_DUR_STEP;
    n = Math.max(ANIM_DUR_MIN, Math.min(ANIM_DUR_MAX, n));
    lsSet(LS_ANIM_DUR, String(n));
    return n;
  }
  function animFamily() {
    var at = localAnimType(), ld = localAnimDir();
    if (at === 'auto') { // 跟随电脑
      at = ANIM_AT_DESKTOP.indexOf(CFG.animType) >= 0 ? CFG.animType : 'flip';
      ld = at === 'flip' ? (CFG.animFlipDir === 'down' ? 'down' : 'up')
        : at === 'scale' ? (CFG.animScaleDir === 'grow' ? 'grow' : 'shrink') : '';
    }
    var dir = at === 'flip' ? (ld === 'down' ? 'dir-down' : 'dir-up')
      : at === 'scale' ? (ld === 'grow' ? 'dir-grow' : 'dir-shrink') : '';
    return { at: at, dir: dir };
  }
  // [v1.0.5.7] 动画节奏：本机设过就用本机的；「跟随电脑」或没设过则用宿主下发的
  function localAnimEase() {
    var v = lsGet(LS_ANIM_EASE);
    return ANIM_EASE_ALL.indexOf(v) >= 0 ? v : 'auto';
  }
  function animEase() {
    var v = localAnimEase();
    if (v === 'auto') return ANIM_EASE_CSS[CFG.animEase] ? CFG.animEase : 'default';
    return v;
  }
  // 动画时长 + 节奏一起写到容器上：时钟（#time-display）与全屏大字（#fs-time）各持一份。
  // 节奏为「弹性」时删掉变量（而不是写空串）—— 见 ANIM_EASE_CSS 处的说明。
  function applyAnimVars(node) {
    if (!node) return;
    node.style.setProperty('--anim-duration', animDur() + 'ms');
    var c = ANIM_EASE_CSS[animEase()];
    if (c) node.style.setProperty('--anim-ease', c);
    else node.style.removeProperty('--anim-ease');
  }
  // ---- 字体：本机可选（预设 / 自定义名字），选「跟随电脑」才用宿主下发的 fontFamily ----
  function sanitizeFontName(s) {
    // 只剔危险字符（引号 / 反斜杠 / 分号…），**保留中文等非 ASCII** ——
    // 写成 [^A-Za-z0-9 _-] 会把「微软雅黑」剥成空串，字体设置永远不生效（老 bug）。
    return String(s == null ? '' : s).replace(/["'`\\;{}<>\/]/g, '').trim().slice(0, 40);
  }
  function localFont() {
    var v = lsGet(LS_FONT);
    return (v === null || v === '') ? 'auto' : v;
  }
  function fontStack() {
    var v = localFont();
    if (v.indexOf('custom:') === 0) {
      var cn = sanitizeFontName(v.slice(7));
      return (cn ? '"' + cn + '",' : '') + FONT_PRESETS.system;
    }
    if (v !== 'auto' && FONT_PRESETS[v]) return FONT_PRESETS[v];
    var ff = sanitizeFontName(CFG.fontFamily); // auto = 跟随电脑
    return (ff ? '"' + ff + '",' : '') + FONT_PRESETS.system;
  }
  function applyFont() { document.body.style.fontFamily = fontStack(); }
  function setLocalFont(v) { lsSet(LS_FONT, String(v == null ? 'auto' : v)); applyFont(); }

  // 全屏大字挂上与桌面时钟**同一套**动画类 —— 这就是「动画保持一致」的全部机制：
  // 同一份 CSS、同一族类名（anim-<家族> dir-<方向>），配置变了跟着变。
  function applyFsAnim(a) {
    var node = el('fs-time'); if (!node) return;
    a = a || animFamily();
    applyAnimVars(node);
    var cls = 'anim-' + a.at + (a.dir ? ' ' + a.dir : '');
    if (node.className !== cls) { node.className = cls; fsSt.key = null; } // 家族变了 → 下一拍整份重画
  }

  function applyStatic() {
    var clock = el('clock');
    var a = animFamily();
    // 只在真的变了才赋值：反复赋同一个字符串虽无害，但改 className 有可能打断
    // 正在播放的 CSS 动画（用户连点 chips 时尤其明显），能免则免。
    var cls = 'anim-' + a.at + (a.dir ? ' ' + a.dir : '')
      + (CFG.datePosition === 'above' ? ' date-above' : '');
    if (clock.className !== cls) clock.className = cls;
    // 时钟数字的时长与节奏：这里也要写一遍（fit() 只在字号重算时才写，宿主改配置走的是本路径）
    applyAnimVars(el('time-display'));
    applyFsAnim(a);
    applyFont();
    cdLangRefresh(); // 语言 / 字号等配置变了，倒计时面板的文案一起跟上
  }

  function setStatus() {
    var zh = CFG.language !== 'en';
    el('status').textContent = online
      ? (zh ? '实时同步' : 'Live')
      : (zh ? '连接断开，本地继续走时' : 'Disconnected — running locally');
    el('dot').className = online ? 'dot' : 'dot off';
  }

  // ====== 主循环：对齐秒边界（ms 级校准也生效） ======
  function schedule() {
    if (tickTimer) clearTimeout(tickTimer);
    var off = totalOffset();
    var ms = 1000 - (((Date.now() + SYNC_MS + off) % 1000) + 1000) % 1000;
    tickTimer = setTimeout(function () { tickTimer = null; tick(); }, ms + 1);
  }

  function tick() {
    var now = effNow();
    var dg = digitsOf(now);
    renderInfo(now);
    applyColors(now);
    applyAmpm(use12() ? ampmLabel(now.getHours()) : '');
    if (lastKey === null || lastLen !== dg.length) {
      build(dg);
      lastKey = dg.join('');
      lastLen = dg.length;
      fit();
    } else if (lastKey !== dg.join('')) {
      swap(dg);
      lastKey = dg.join('');
    }
    schedule();
  }

  // 页面版本自愈：宿主给的值与本页内嵌的值不一致 → 自己在跑旧脚本，立刻重载换新
  function checkPageBuild(v) {
    if (pageReloaded) return;
    if (!v || typeof v !== 'string') return;   // 宿主没给（老宿主 / stat 失败）→ 不动
    // ⚠️ 必须按「形状」判定占位符有没有被替换，**不能**拿 PAGE_BUILD 跟那个占位符字面量比：
    // 宿主是把整份 HTML 里的该串**全量**替换掉的（连注释里的也算），那种写法会被换坏成
    // 「自己跟自己相等」→ 恒真早退 → 自愈彻底失效（这条是被 jsdom 用例抓出来的）。
    // 真版本一定形如 mtimeMs:size（数字开头），占位符不是 → 用形状区分最稳。
    if (!/^\d+(\.\d+)?:\d+$/.test(PAGE_BUILD)) return; // 未被替换（file:// 直开）→ 不动
    if (v === PAGE_BUILD) return;                       // 一致 → 正常
    pageReloaded = true;                                // 加锁：一次会话只重载一次，杜绝循环
    try { location.reload(); } catch (e) { /* ignore */ }
  }

  // ====== 拉取快照 ======
  function pull() {
    var t0 = Date.now();
    var url = tokenPath();
    fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (j) {
        checkPageBuild(j.build);
        var t1 = Date.now();
        SYNC_MS = nm(j.now, Date.now()) - (t0 + t1) / 2;
        var next = j.cfg || CFG;
        var changed = !haveRemote || JSON.stringify(next) !== JSON.stringify(CFG);
        CFG = next;
        haveRemote = true;
        online = true; fails = 0;
        if (changed) {
          applyStatic();
          lastKey = null; lastInfo = ''; colorKey = ''; lastAmpm = null;
        }
        setStatus();
        applyCdSnapshot(j);
      })
      .catch(function () {
        fails++;
        if (fails >= 2) { online = false; setStatus(); }
      });
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { pull(); schedule(); }
  });
  window.addEventListener('resize', function () { fit(); if (fsOpen) fsFit(); });
  window.addEventListener('orientationchange', function () { setTimeout(function () { fit(); if (fsOpen) fsFit(); }, 120); });

  // ==================== [v1.0.5.7] 倒计时（手机端） ====================
  // 设计要点：
  //   · 只在「列表变更」时重画卡片；剩余时间由本机每秒自减，不走网络（不打扰宿主）
  //   · 时间基准用 realNow()（= 本机 + 快照时间差），和 endAt 同源，手机时钟不准也不会跑偏
  //   · 写请求一律「先领一次性令牌 → 再带 X-DC-Nonce 提交」，令牌不缓存（一次一用最稳）
  //   · 触控细节：所有可点目标 ≥44px、步进器支持长按连加、下滑抽屉关闭、关键动作震动反馈
  var CDS = { items: [], canEdit: false, loaded: false };
  var cdSheetOpen = false, cdEditId = null, cdBusy = false;
  var cdDurH = 0, cdDurM = 5, cdDurS = 0, cdTouched = false, cdAppliedDefault = -1;
  var cdArmDelete = null, cdArmTimer = null, cdNodes = {}, cdSig = '', cdFabSig = '';
  var cdIdleTimer = null; // 胶囊自动隐藏的定时器
  var fsOpen = false, fsId = null, fsSnap = false, fsPillTxt = ''; // 全屏倒计时状态
  var fsRung = false;      // 当前这条倒计时是否已到点（驱动 #fs-sweep 掠屏）
  var fsMorphing = false, fsMorphTimer = null, fsOpenTimer = null; // 进出全屏的形变动画
  // 进全屏 = 形变（0.8s）铺满 → **立刻**切界面：
  //   ① FS_MORPH_OPEN_MS —— 形变：玻璃从胶囊长满整屏；
  //   ② 切界面 —— #fs-view 自己 .22s 淡入盖过时钟（＝「时钟淡出 / 全屏淡入」），
  //      数字 / 按钮这时才浮上来。
  //   FS_MORPH_HOLD_MS 是「形变放完再停一拍」的空等，曾试过 0.8s / 0.3s，用户反馈都嫌停顿 → **归 0**。
  // 出全屏只有一拍 FS_MORPH_MS（缩回胶囊）：回时钟要干脆。
  var FS_MORPH_MS = 320;
  var FS_MORPH_OPEN_MS = 800;
  var FS_MORPH_HOLD_MS = 0; // 0 = 形变放完立刻切界面（不再空等）
  var fsSt = { ed: [], key: null, len: 0 }; // 全屏大字的逐位渲染状态（与 clockSt 同构）
  var fsIdleTimer = null; // 全屏里那颗时钟胶囊的淡出计时
  var fsBusy = false, fsArmed = false, fsArmTimer = null, fsActsSig = ''; // 右下角两个按钮的状态
  var fsMsgTimer = null;  // 「操作失败」小字的自动收起计时
  var FS_PAD = 16, FS_GAP = 12; // 全屏底部左右内边距 / 数字与按钮之间的间距（fsFit 要用）
  var CD_MIN_MS = 1000, CD_MAX_MS = 24 * 3600 * 1000;
  var CD_CHIPS = [60, 180, 300, 600, 900, 1800, 3600];

  function ZH() { return CFG.language !== 'en'; }
  function T(zh, en) { return ZH() ? zh : en; }
  function cdVibrate(p) {
    try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* 桌面浏览器没有，忽略 */ }
  }
  function cdErr(m) { el('cd-err').textContent = m || ''; }
  function cdErrClear() { el('cd-err').textContent = ''; }

  // 剩余秒数：运行中按 endAt 本地算；暂停用快照里的静态值。向上取整 —— 最后一秒显示 00:01 而不是 00:00
  function cdSecLeft(it) {
    if (it.state === 'paused') return Math.max(0, Math.ceil(nm(it.remainingMs, 0) / 1000));
    var end = it.endAt ? Date.parse(it.endAt) : NaN;
    var ms = isFinite(end) ? (end - realNow()) : nm(it.remainingMs, 0);
    return Math.max(0, Math.ceil(ms / 1000));
  }
  function cdClock(sec) {
    sec = Math.max(0, Math.round(sec));
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
  }

  // ---- 写请求：领令牌 + 提交（同源，永不拼外部主机） ----
  function cdWrite(method, path, body) {
    return fetch(apiPath('write-nonce'), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http-' + r.status); return r.json(); })
      .then(function (j) {
        var nonce = String((j && j.nonce) || '');
        if (!nonce) throw new Error('nonce-empty');
        var opt = {
          method: method, cache: 'no-store',
          headers: { 'Content-Type': 'application/json', 'X-DC-Nonce': nonce },
        };
        if (body !== undefined) opt.body = JSON.stringify(body);
        return fetch(apiPath(path), opt);
      })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok || j.ok === false) throw new Error((j && j.error) || ('http-' + r.status));
          return j;
        });
      });
  }
  function cdErrText(e) {
    var k = String((e && e.message) || e || '');
    if (k.indexOf('bad-duration') === 0) return T('时长需要在 1 秒 ~ 24 小时之间', 'Duration must be 1s – 24h');
    if (k === 'too-many') return T('倒计时数量已达上限（50 个）', 'Too many countdowns (max 50)');
    if (k === 'not-found') return T('这个倒计时已经不存在了', 'That countdown no longer exists');
    if (k === 'empty-update') return T('没有可保存的改动', 'Nothing to save');
    if (k === 'http-429') return T('操作太快了，稍等一下', 'Too fast — try again in a moment');
    if (k === 'http-413') return T('提交内容过大', 'Payload too large');
    if (k === 'http-415' || k === 'nonce-empty' || k === 'http-403') return T('校验失败，请刷新页面重试', 'Verification failed — reload the page');
    return T('操作失败，请稍后再试', 'Something went wrong');
  }
  function cdApply(j) {
    if (j && Array.isArray(j.items)) {
      CDS.items = j.items; CDS.loaded = true;
      renderCdList();
      cdSyncFab(); // 写成功后底部胶囊立刻反映新读数，不等下一秒 tick
    }
  }

  // ---- 快照合并 ----
  function applyCdSnapshot(j) {
    if (!j) return;
    if (Array.isArray(j.countdowns)) { CDS.items = j.countdowns; CDS.loaded = true; }
    if (j.countdownCanEdit !== undefined) CDS.canEdit = j.countdownCanEdit === true;
    // 宿主的「默认时长」偏好是随快照到的：首次拿到时补齐表单，
    // 但用户已经开始调时间（或正在编辑某个倒计时）就绝不打断
    var dm = Math.max(1, Math.min(1440, Math.round(nm(CFG.countdownDefaultMinutes, 5))));
    if (!cdEditId && !cdTouched && !el('cd-name').value && dm !== cdAppliedDefault) cdResetForm();
    cdSyncFab();
    fsActsSig = ''; if (fsOpen) fsPaintActs(); // 权限刚到手 → 全屏里按钮要立刻现身
    if (cdSheetOpen) renderCdList();
  }

  // ---- 底部胶囊 ----
  // [v1.0.5.7] 显隐分两层，别混：
  //   · 结构性（hidden-fab）—— 只在三种情况下根本不出现：
  //       抽屉开着 / 全屏倒计时中 / **宿主还没告知过倒计时**（老宿主，CDS.loaded=false）
  //   · 时间性（idle）      —— **只有「未激活」才允许 3 秒无操作淡出**。
  //     「激活」= 至少有一条运行中的倒计时：这时胶囊要常驻，因为
  //       ① 剩余读数是给人一眼看的；② 它同时是点进全屏的唯一入口。
  //     「未激活」= 全部暂停 **或一条都没有（含全部被关掉）** → 两者走同一套淡出逻辑，
  //       点一下屏幕就回来（**不是永久隐藏**）。
  //     ⚠️ 别按「条目数」隐藏胶囊：空态胶囊本身就是「新建倒计时」的入口，
  //        隐藏掉就等于「一条都没有时怎么点都不出来」（实测踩过）。
  // 唤醒底部胶囊（屏幕上任何一次操作都算）；排计时统一交给 cdArmIdle
  function cdPokeFab() {
    fsPokePill(); // 全屏中时操作的对象是另一颗胶囊（时钟胶囊），一并唤醒
    if (cdIdleTimer) { clearTimeout(cdIdleTimer); cdIdleTimer = null; }
    var fab = el('cd-fab');
    if (fab.classList.contains('idle')) {
      fab.classList.remove('idle');
      cdFabSig = ''; // 隐藏期间读数一直在走，唤醒时按最新值重画一次
      cdSyncFab();   // 立刻重画；要不要重新排队计时也由它一处决定
      return;
    }
    cdArmIdle();
  }
  // 「未激活」才排淡出计时：激活中（有运行中的）既不排也不收
  function cdArmIdle() {
    if (cdIdleTimer || cdSheetOpen || fsOpen) return;
    if (!CDS.loaded || el('cd-fab').classList.contains('hidden-fab')) return; // 没得显示就别排
    if (el('cd-fab').classList.contains('idle')) return; // 已经藏着了，不必再排（避免每 3 秒空转一次）
    if (cdPick().anyRunning) return;
    cdIdleTimer = setTimeout(cdIdleHide, FAB_IDLE_MS);
  }
  function cdIdleHide() {
    cdIdleTimer = null;
    // 抽屉开着 → 胶囊本来就藏着；全屏中 → 有另一颗胶囊；到点提醒中 → 此刻正需要人看见。都不收。
    if (cdSheetOpen || cdAlert.active || fsOpen) return;
    if (!CDS.loaded || el('cd-fab').classList.contains('hidden-fab')) return;
    if (cdPick().anyRunning) return; // 兜底：激活中绝不收（哪怕有个残留计时器）
    el('cd-fab').classList.add('idle');
  }

  // 「最近一次倒计时」= 剩余最少的那个（全是暂停态时也取剩余最少的）。
  // 胶囊与全屏共用这一份判定 —— 保证点进全屏看到的就是胶囊上那个。
  function cdPick() {
    var items = CDS.items || [], best = null, bestSec = Infinity, anyRunning = false;
    items.forEach(function (it) {
      if (it.state === 'paused') return;
      anyRunning = true;
      var s = cdSecLeft(it);
      if (s < bestSec) { bestSec = s; best = it; }
    });
    if (!best) { // 全是暂停态 → 显示剩余最少的那个
      items.forEach(function (it) {
        var s = cdSecLeft(it);
        if (s < bestSec) { bestSec = s; best = it; }
      });
    }
    return {
      item: best,
      sec: isFinite(bestSec) ? Math.max(0, bestSec) : 0,
      has: !!best,
      anyRunning: anyRunning,
      count: items.length,
    };
  }

  function cdSyncFab() {
    var fab = el('cd-fab');
    // [v1.0.5.7] 结构性隐藏只有三种：抽屉开着、全屏倒计时中、宿主还没告知过倒计时。
    // ⚠️ 这里**不按条目数隐藏**：「全部暂停」「一条都没有（含全部被关掉）」都属于
    //    「未激活」，走同一套 3 秒淡出逻辑（点一下屏幕就回来），空态胶囊本身就是
    //    「新建倒计时」的入口。老宿主从不给 countdowns → CDS.loaded 恒 false → 不出现。
    var show = CDS.loaded && !cdSheetOpen && !fsOpen;
    fab.classList.toggle('hidden-fab', !show);
    if (!show) {
      fab.classList.remove('idle');
      if (cdIdleTimer) { clearTimeout(cdIdleTimer); cdIdleTimer = null; }
      return;
    }
    var p = cdPick();
    // [v1.0.5.7] 有倒计时**在跑**（能走到这里 → 必然没在全屏）→ 胶囊按**剩余比例**上色：
    // 有色部分的宽度 = 剩余 / 总时长，和全屏水位条同一条曲线，每秒跟着退。
    // 全暂停 / 一条都没有 = 未激活 → 不上色（`.paused` 那半透明的样子就够表达「歇着」了）。
    var live = !!p.anyRunning && !fsOpen;
    fab.classList.toggle('fab-live', live);
    if (live) fab.style.setProperty('--fab-pct', (fsRatio(p.item) * 100).toFixed(2) + '%');
    if (p.anyRunning) {
      // 激活中 → 常驻：清掉淡出计时；正处在 idle（比如刚由「全暂停」转运行）就立刻唤回来，
      // 否则胶囊会一直藏着 → 读数看不见、也点不进全屏
      if (cdIdleTimer) { clearTimeout(cdIdleTimer); cdIdleTimer = null; }
      if (fab.classList.contains('idle')) { fab.classList.remove('idle'); cdFabSig = ''; }
    } else {
      cdArmIdle(); // 未激活（全暂停 / 一条都没有）→ 从这一拍起算 3 秒
    }
    if (fab.classList.contains('idle')) return; // 隐藏期间不写 DOM；唤醒时会整份重画
    // 这个函数每秒都会被 tickCd 调到：内容没变就别碰 DOM（手机上省一点是一点）
    var sig = (p.has ? '' : 'e') + p.sec + '|' + p.count + '|'
      + (p.anyRunning ? 1 : 0) + '|' + (CDS.canEdit ? 1 : 0);
    fab.classList.toggle('has', p.has);
    fab.classList.toggle('empty', !p.has);
    fab.classList.toggle('paused', !p.anyRunning && p.has);
    if (sig === cdFabSig) return;
    cdFabSig = sig;
    if (!p.has) { // 空态：胶囊 = 新建入口（可写才给 ＋，只读就只报个名字）
      el('cd-fab-text').innerHTML = '<span class="cd-fab-empty">'
        + esc(CDS.canEdit ? T('＋ 倒计时', '+ Countdown') : T('倒计时', 'Countdown'))
        + '</span>';
      return;
    }
    var more = p.count > 1 ? '  +' + (p.count - 1) : '';
    el('cd-fab-text').innerHTML = p.sec <= 0
      ? '<span class="cd-fab-num">' + esc(T('提醒中', 'Ringing')) + '</span>'
      : '<span class="cd-fab-num">' + esc(cdClock(p.sec)) + '</span>'
        + '<span class="cd-fab-more">' + esc(more) + '</span>';
  }

  // ===== 全屏倒计时（仅手机端）：左橙 / 右白黑，橙色宽度 = 剩余比例 =====
  // 用毫秒算比例（不是整秒），配合 #fs-fill 的 1s 线性过渡 → 橙色退得很顺
  function fsRatio(it) {
    var dur = nm(it && it.durationMs, 0);
    if (!(dur > 0)) return 0;
    var left = it.state === 'paused' ? nm(it.remainingMs, 0)
      : (it.endAt ? Date.parse(it.endAt) - realNow() : NaN);
    if (!isFinite(left)) left = nm(it.remainingMs, 0);
    return Math.max(0, Math.min(1, left / dur));
  }
  // 大数字：与桌面时钟**共用** buildInto/swapIn（逐位、只动真的变了的位）。
  // 动画家族来自 #fs-time 上的 anim-<家族> dir-<方向> —— 也就是电脑里设置的那一套，
  // 所以「全屏前时钟是翻转，全屏后倒计时也是翻转」，方向/时长/错峰全都一致。
  function fsRender(txt) {
    var node = el('fs-time');
    var dg = txt.replace(/:/g, '').split('');
    var key = dg.join('');
    if (fsSt.key === null || fsSt.len !== dg.length) {
      buildInto(node, fsSt, dg);
      fsSt.key = key; fsSt.len = dg.length;
      node.setAttribute('data-t', txt);
      fsFit(); // 位数变了（mm:ss ↔ h:mm:ss）→ 字号要重算
      return;
    }
    if (fsSt.key !== key) { swapIn(node, fsSt, dg); fsSt.key = key; }
    node.setAttribute('data-t', txt);
  }

  // ---- 全屏字号的「本机倍率」（与主界面时钟的 dc.clockScale 相互独立）----
  function fsScale() {
    var v = Number(lsGet(LS_FS_SCALE));
    if (!isFinite(v) || v <= 0) return 100;
    return Math.max(SCALE_MIN, Math.min(SCALE_MAX, Math.round(v / SCALE_STEP) * SCALE_STEP));
  }
  function setFsScale(v) {
    var n = Math.max(SCALE_MIN, Math.min(SCALE_MAX, Math.round(Number(v) / SCALE_STEP) * SCALE_STEP));
    lsSet(LS_FS_SCALE, String(n));
    return n;
  }

  // ---- 全屏「模糊数字」：5 秒无操作 + 剩余 ≥1 分钟 → 秒的那两位显示成 -- ----
  // 任何操作（触摸 / 点击 / 按键 / 滚动）都算「有交互」，那一刻起重新计时；
  // 剩余不足 1 分钟一律不模糊（最后一分钟必须看得见秒）。fsIdleAt = 最后一次操作的时间戳。
  var FS_BLUR_IDLE_MS = 5000, FS_BLUR_MIN_SEC = 60;
  var fsIdleAt = 0, fsBlurred = false;
  function fsBlurOn() { return lsGet(LS_FS_BLUR) === '1'; }
  function setFsBlur(on) { lsSet(LS_FS_BLUR, on ? '1' : '0'); return !!on; }
  function fsPokeBlur() { fsIdleAt = Date.now(); }
  function fsShouldBlur(it, sec) {
    if (!fsBlurOn() || !it) return false;
    if (sec < FS_BLUR_MIN_SEC) return false;        // 最后一分钟：秒必须看得见
    return (Date.now() - fsIdleAt) >= FS_BLUR_IDLE_MS;
  }
  // 把 mm:ss / h:mm:ss 的**最后两位**（秒）换成 --，时与分原样保留
  function fsBlurText(txt) { return txt.replace(/\d\d$/, '--'); }

  // ---- 全屏水位条的配色：存一个色相（0–359），夜/昼各生成一套渐变端点 ----
  var FS_HUE_DEFAULT = 24; // ≈ 原来的橙
  function fsHue() {
    // ⚠️ Number(null) === 0（不是 NaN）：不特判 null 的话「从没设过」会被读成色相 0（纯红），
    //    而不是默认的橙。所以必须先挡掉 null / 空串。
    var raw = lsGet(LS_FS_HUE);
    if (raw === null || raw === '') return FS_HUE_DEFAULT;
    var v = Number(raw);
    if (!isFinite(v)) return FS_HUE_DEFAULT;
    return ((Math.round(v) % 360) + 360) % 360;
  }
  function setFsHue(v) {
    var n = ((Math.round(Number(v)) % 360) + 360) % 360;
    lsSet(LS_FS_HUE, String(n));
    return n;
  }
  // 只写 CSS 变量（四个端点），日间/夜间用哪一套由 CSS 的 body.is-day 决定。
  // 形变层（#fs-morph）也要写同一套 —— 它就是「背景的预览」，颜色必须跟全屏完全一致，
  // 长到整屏时才能无缝切过去（差一点点就会看出「换了一幅画面」）。
  function fsApplyAccent() {
    var v = el('fs-view');
    if (!v) return;
    var h = fsHue();
    var dark = ['hsl(' + h + ', 82%, 45%)', 'hsl(' + h + ', 88%, 55%)'];
    var day = ['hsl(' + h + ', 88%, 62%)', 'hsl(' + h + ', 90%, 76%)'];
    var m = el('fs-morph');
    [v, m].forEach(function (node) {
      if (!node) return;
      node.style.setProperty('--fs-a', dark[0]);
      node.style.setProperty('--fs-b', dark[1]);
      node.style.setProperty('--fs-da', day[0]);
      node.style.setProperty('--fs-db', day[1]);
    });
    // 顶部胶囊的「半边淡色」也跟同一色相，但压到 ~1/5 透明度 ——
    // 它只是个「有倒计时在跑」的提示，不能抢了读数。
    var fab = el('cd-fab');
    if (fab) {
      fab.style.setProperty('--fab-a', 'hsla(' + h + ', 85%, 60%, .20)');
      fab.style.setProperty('--fab-da', 'hsla(' + h + ', 80%, 45%, .14)');
    }
    fsApplySweep(); // 到点扫描块的配色跟着水位条走
  }
  // ---- 到点扫描：一条竖直色块从左往右不断掠过（见 CSS 的 #fs-sweep / @keyframes fsSweep）----
  // 宽度 = 屏宽的比例（CSS 里的 26% 必须与这里同值）。宽度越大越醒目、掠过越慢。
  var FS_SWEEP_W = 26;
  // 配色规则：默认红；**用户把水位条本身调成红色时改用反差色绿** —— 否则红压红、完全看不出来。
  function fsApplySweep() {
    var n = el('fs-sweep'); if (!n) return;
    var h = fsHue();
    var isRed = (h <= 20 || h >= 340); // 色相 ±20° 内都算「红」
    var rgb = isRed ? '34,197,94' : '220,38,38';
    n.style.background = 'linear-gradient(90deg,'
      + ' rgba(' + rgb + ',0), rgba(' + rgb + ',.66) 50%, rgba(' + rgb + ',0))';
  }
  // 字号自适应：按「可用宽度」（视口宽 − 左右内边距 − 右侧按钮 − 间距）算，
  // 保证大数字永远待在左下角、不会越过右边界。
  // 倍率标定：150% 恰好用满可用宽度（上限），100%（默认）是上限的 2/3 —— 这样
  // 「放大 / 缩小」两档都有真实效果，且任何倍率下都不会溢出。
  function fsFit() {
    if (!fsOpen) return;
    var node = el('fs-time');
    var acts = el('fs-acts');
    var actsW = (acts && !acts.hidden) ? acts.getBoundingClientRect().width : 0;
    var probe = 100;
    node.style.fontSize = probe + 'px'; // ⚠️ 测量必须用基准字号，倍率不掺进来
    var w = node.getBoundingClientRect().width || 1;
    var avail = Math.max(120, window.innerWidth - FS_PAD * 2 - (actsW ? actsW + FS_GAP : 0));
    var fitMax = probe * (avail / w);            // 物理上限：刚好占满可用宽度
    var px = fitMax * fsScale() / SCALE_MAX;     // 150% 用满；100% = 上限的 2/3
    px = Math.max(20, Math.min(px, fitMax, Math.round(window.innerHeight * 0.42)));
    node.style.fontSize = Math.round(px) + 'px';
    applyAnimVars(node);
  }

  // ---- 右下角两个大按钮：左 = 暂停/继续，右 = 取消（二次确认后删除并退出全屏）----
  // 只读宿主（没开放手机端改倒计时）→ 没有可执行的动作，整组收起来，别给假按钮。
  function fsPaintActs(p) {
    var acts = el('fs-acts'); if (!acts) return;
    p = p || cdPick();
    var it = p.item;
    acts.hidden = !CDS.canEdit;
    if (!CDS.canEdit) { fsActsSig = ''; return; }
    var paused = !it || it.state === 'paused';
    var sig = (paused ? 'r' : 'p') + '|' + (fsBusy ? 1 : 0) + '|' + (fsArmed ? 1 : 0);
    if (sig === fsActsSig) return;
    fsActsSig = sig;
    var tg = el('fs-toggle');
    // 按钮里没有文字：图标由 data-act 决定（pause → 两条竖条 / resume → 三角），
    // 无障碍语义与语言切换都走 aria-label。
    tg.setAttribute('data-act', paused ? 'resume' : 'pause');
    tg.setAttribute('aria-label', paused ? T('继续', 'Resume') : T('暂停', 'Pause'));
    tg.disabled = fsBusy || !it;
    var cx = el('fs-cancel');
    // 第一下之后：变红 + 图形从 ✕ 换成 ✓（「再点一次才真删」必须有视觉信号）
    cx.setAttribute('aria-label', fsArmed ? T('确认取消', 'Confirm cancel') : T('取消', 'Cancel'));
    cx.classList.toggle('armed', !!fsArmed);
    cx.disabled = fsBusy || !it;
  }
  function fsMsg(txt) {
    var n = el('fs-msg'); if (!n) return;
    n.textContent = txt || '';
    n.classList.toggle('show', !!txt);
    if (fsMsgTimer) { clearTimeout(fsMsgTimer); fsMsgTimer = null; }
    if (txt) fsMsgTimer = setTimeout(function () { n.classList.remove('show'); }, 2600);
  }
  function fsArmCancel() {
    fsArmed = true;
    cdVibrate(14);
    fsPaintActs();
    if (fsArmTimer) clearTimeout(fsArmTimer);
    fsArmTimer = setTimeout(function () { fsArmed = false; fsPaintActs(); }, 3500);
  }
  // 写入口和抽屉完全一样：先领一次性令牌，再 POST。唯一写入口仍是 /api/countdowns/<id>/<act>
  function fsDo(act) {
    var p = cdPick();
    if (fsBusy || !p.item) return;
    var id = p.item.id;
    fsBusy = true; fsMsg(''); fsPaintActs(p);
    cdWrite('POST', 'countdowns/' + encodeURIComponent(id) + '/' + act, {})
      .then(function (j) {
        cdApply(j);
        cdVibrate(10);
        if (act === 'cancel') { closeFs(); return; } // 删掉当前这条 → 收起全屏
        fsTick(); // 暂停/继续 → 立刻按新状态刷新大字与按钮
      })
      .catch(function (e) { fsMsg(cdErrText(e)); cdVibrate(60); })
      .then(function () { fsBusy = false; if (fsOpen) fsPaintActs(cdPick()); });
  }
  // 全屏里那颗胶囊显示「当前时间」：不做动画；带不带秒跟电脑上的设置走
  function fsClockText() {
    var d = effNow(), h = d.getHours(), m = d.getMinutes();
    var t = use12() ? String((h % 12) || 12) + ':' + pad(m) : pad(h) + ':' + pad(m);
    return CFG.showSeconds !== false ? t + ':' + pad(d.getSeconds()) : t;
  }
  function fsTick() {
    if (!fsOpen) return;

    if (fsId !== p.item.id) { // 换了对象：橙区直接就位，别从上一条的宽度滑过去
      fsId = p.item.id;
      fsSnap = true;
      fsArmed = false;
      fsBlurred = false;
      fsSt.key = null; // 清空旧串 → 整份重画，不留上一条的残影
      el('fs-name').textContent = p.item.name || T('倒计时', 'Countdown');
    }
    var pct = (fsRatio(p.item) * 100).toFixed(2) + '%';
    el('fs-fill').style.width = pct;
    // 形变层里的那条水位条也要同步：它整段动画都在「预览背景」，
    // 少同步一次就会出现「长到整屏时水位比真背景少一截」，切换时露馅。
    var mf = el('fs-morph-fill'); if (mf) mf.style.width = pct;
    if (fsSnap) {
      fsSnap = false;
      var f = el('fs-fill');
      f.classList.add('snap');
      void f.offsetWidth; // 强制重排：让刚设的宽度以「无过渡」生效

    // 模糊秒数：静止 5 秒 + 剩余 ≥1 分钟 → 秒那两位换成 --。
    // 模糊状态**翻转的那一拍整份重画**（fsSt.key=null → buildInto，不走动画），
    // 所以 -- 出现/消失都是瞬间到位，不会播放一次翻转。
    var txt = cdClock(p.sec);
    var blurred = fsShouldBlur(p.item, p.sec);
    if (blurred) txt = fsBlurText(txt);
    if (blurred !== fsBlurred) { fsBlurred = blurred; fsSt.key = null; }
    fsRender(txt);
    // 到点扫描：剩余归零且仍在运行 = 「时间到了」→ 色块开始掠屏，直到这条被关掉。
    // （暂停后 state 不再是 running，扫描自然停；取消/删除会直接退出全屏。）
    var rung = !!p.item && p.item.state === 'running' && p.sec <= 0;
    if (rung !== fsRung) {
      fsRung = rung;

  }
  // ---- 进出全屏的形变动画（FLIP）：一块玻璃从胶囊矩形长到整屏，反向就是缩回胶囊 ----
  // 观感目标 = 手机上点开 / 关掉一个 app 图标。几个必须守住的点：
  //   · 起点要**在 cdSyncFab() 把胶囊藏掉之前**量（藏掉是 display:none，rect 会全是 0）
  //   · 形变层 = 「背景的预览」（底色 + 同比例水位条，即 #fs-morph / #fs-morph-fill），
  //     长到整屏时与 #fs-view 的画面逐像素一致 → 收层直接切，不需要淡出（淡出会像糊了层白）
  //   · 进全屏**三段式**：形变铺满整屏（0.8s）→ 空等（0.8s，此刻露的是原样的时钟）→ 切界面
  //   · 系统开了「减弱动态效果」就直接切换，不做形变（尊重无障碍偏好）
  function reducedMotion() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  }

  function fabRect() {
    var fab = el('cd-fab');
    if (fab && !fab.classList.contains('hidden-fab')) {
      var r = rectOf(fab);
      if (r.width > 1 && r.height > 1) { r.radius = 999; return r; }
    }

  }
  // 形变→到位即隐：形变层与真背景**逐像素一致**（同底色、同水位条），
  // 收层那一刻画面完全不变，看不出接缝 —— 淡出反而会露出下面那幅几乎相同的画，
  // 看着像「糊了一层」。所以进 / 出全屏都用「到位即隐」，不做溶解。
  function fsMorphRun(from, to, done, ms) {
    var m = el('fs-morph');
    if (!m) { if (done) done(); return; }
    ms = ms || FS_MORPH_MS;
    // 短的一拍（320ms）用「快出慢收」；长的一拍（800ms）换成更匀的曲线 ——
    // 否则前 1/3 就长满了、后面大半段在爬，反而像卡住。
    var ease = ms > 500 ? 'cubic-bezier(.4,0,.2,1)' : 'cubic-bezier(.22,.68,.36,1)';
    m.style.transition = 'none';
    m.style.left = from.left + 'px'; m.style.top = from.top + 'px';
    m.style.width = from.width + 'px'; m.style.height = from.height + 'px';
    m.style.borderRadius = (from.radius || 999) + 'px';
    m.style.opacity = '1';
    m.style.visibility = 'visible';
    void m.offsetWidth; // 强制重排：起点先落地，下面这段过渡才会真的播出来
    m.style.transition = 'left ' + ms + 'ms ' + ease + ', top ' + ms + 'ms ' + ease
      + ', width ' + ms + 'ms ' + ease + ', height ' + ms + 'ms ' + ease
      + ', border-radius ' + ms + 'ms ' + ease;
    m.style.left = to.left + 'px'; m.style.top = to.top + 'px';
    m.style.width = to.width + 'px'; m.style.height = to.height + 'px';
    m.style.borderRadius = (to.radius || 0) + 'px';
    // 收尾：位置动画放完（ms + 40 那点零头是给浏览器留的余量）
    if (fsMorphTimer) clearTimeout(fsMorphTimer);
    fsMorphTimer = setTimeout(function () {
      fsMorphTimer = null;
      fsMorphing = false;
      m.style.transition = 'none';
      m.style.visibility = 'hidden';
      if (done) done();
    }, ms + 40);
  }

  // 形变放完 → 切界面：加 .show → #fs-view 自带 .22s 淡入盖过时钟（这就是「淡入淡出」）。
  // ⚠️ FS_MORPH_HOLD_MS 若为 0 必须**同步**执行：若包一层 setTimeout(0)，
  //    中间会渲染出「形变层已隐、#fs-view 还没上来」的一帧 —— 时钟一闪。
  function fsOpenCommit(v) {
    if (fsOpenTimer) { clearTimeout(fsOpenTimer); fsOpenTimer = null; }
    if (FS_MORPH_HOLD_MS > 0) fsOpenTimer = setTimeout(commit, FS_MORPH_HOLD_MS);
    else commit();
    function commit() {
      fsOpenTimer = null;
      if (!fsOpen) return; // 形变期间已经退出了 → 这一下别再切
      fsPokeBlur();  // 真正「进来」才算有过操作：模糊的 5 秒从切界面这刻起算
      applyFsAnim(); // 形变期间用户可能改过字体 / 动画 → 切之前重刷一遍
      fsTick();
      if (!fsOpen) return; // fsTick() 里「倒计时被删光」会自己退出全屏 → 这一下就别再切了
      // 切换前：形变那 0.8s 里时钟是「活的」，用户完全可能双击数字把面板调出来 → 先收掉

  }

  function fsMorphCancel() {
    if (fsMorphTimer) { clearTimeout(fsMorphTimer); fsMorphTimer = null; }
    if (fsOpenTimer) { clearTimeout(fsOpenTimer); fsOpenTimer = null; }

    if (m) { m.style.transition = 'none'; m.style.opacity = '0'; m.style.visibility = 'hidden'; }

  }

  function openFs() {
    if (fsOpen) return;

    var mid = fsMorphing;
    if (mid) fsMorphCancel();
    if (!cdPick().has) { openCd(); return; } // 空态（一条都没有）→ 直接开抽屉：此时胶囊就是「新建」入口
    // ⚠️ 起点必须在 cdSyncFab() 藏掉胶囊之前量。

    var morph = !reducedMotion() && !mid;

    fsId = null; fsPillTxt = ''; fsSnap = true; fsArmed = false; fsSt.key = null;
    fsBlurred = false; fsRung = false;
    fsApplyAccent();     // 水位条可能刚在电脑上换成别的色（其实只存本机，这里只是保证一致）
    fsMsg('');
    var v = el('fs-view');
    v.classList.remove('rung');
    cdSyncFab(); // 逻辑上已进全屏 → 底部那颗倒计时胶囊先藏（形变层正是从它的矩形长出来的）
    cdVibrate(8);
    if (!morph) {
      // 系统开了「减弱动态效果」/ 接着上一次没放完的动画 → 不做形变，直接切界面
      fsPokeBlur();  // 刚进来算「有过操作」→ 模糊的 5 秒从这一刻起算

      fsTick();
      v.setAttribute('aria-hidden', 'false');

    }
    // ① 形变：玻璃从胶囊长满整屏。此刻 #fs-view **还没有 .show**（整层不可见）→
    //    形变层下面就是**时钟**；形变层是不透明的「背景预览」，正好把时钟整个盖住。

        //    #fs-view 淡入盖过时钟，数字 / 按钮浮上来。

      }, FS_MORPH_OPEN_MS);

  function closeFs() {
    if (!fsOpen) return;
    var mid = fsMorphing;
    if (mid) fsMorphCancel(); // 收尾动画还没放完就又点了一下 → 掐断重来（这次不再重播）
    // ⚠️ 进全屏那「切界面」还没执行就退回来了 → 必须把这一下掐掉，
    //    否则 #fs-view 会自己淡入，用户明明已经退出了。
    if (fsOpenTimer) { clearTimeout(fsOpenTimer); fsOpenTimer = null; }
    var morph = !reducedMotion() && !mid;
    fsOpen = false; fsId = null; fsArmed = false; fsRung = false;
    if (fsArmTimer) { clearTimeout(fsArmTimer); fsArmTimer = null; }
    if (fsIdleTimer) { clearTimeout(fsIdleTimer); fsIdleTimer = null; }

    v.classList.remove('rung');
    v.classList.remove('show');

    if (fab && !fab.classList.contains('hidden-fab')) fab.classList.add('fab-veil');

  }
  // 「按下即触发」——全屏里两个按钮一律不等 click。
  // 原因：真机上 click 要求 down/up 落在同一个元素、且中途不能有合成层变动；
  // 而这一下 pointerdown 会顺带唤醒全屏里的时钟胶囊（visibility + transform 变化 →
  // 合成层重建），真机上整下点击就跟着被丢掉了，表现成「第一次点按钮没反应，
  // 得先点一下屏幕、再点第二下才灵」。按下就执行 → 从根上不依赖 up/click 的配对。
  // （桌面 headless 用的是合成触摸事件，复现不出这个现象，所以这条只能靠实现绕开。）
  // click 分支只服务键盘与辅助技术：那条路径没有 pointerdown，不会被吞。
  function bindPressFire(node, onFire) {
    if (!node) return;

    function arm() {
      swallow = true;
      if (t) clearTimeout(t);
      t = setTimeout(function () { swallow = false; t = null; }, 800); // 兜底：万一 click 压根没来

  // 右下角两个按钮的动作：暂停/继续 一发即生效；取消要点两下（第二下才真删）
  function bindFs() {
    bindPressFire(el('fs-toggle'), function () {
      var p = cdPick();
      if (!p.item || fsBusy) return;
      fsDo(p.item.state === 'paused' ? 'resume' : 'pause');
    });

      var p = cdPick();
      if (!p.item || fsBusy) return;
      if (!fsArmed) { fsArmCancel(); return; } // 第一下只是「武装」，防误删

  }
  // 全屏里那颗「当前时间」胶囊：也要 3 秒没操作就淡出（全屏是看大字的地方，不该长期挡着）；
  // 屏幕上任何一次操作立刻唤回来并重新计时。与底部倒计时胶囊同一套节奏，只是作用对象不同。
  function fsPokePill() {
    if (!fsOpen) return;
    el('fs-pill').classList.remove('idle');
    fsArmPillIdle();
  }
  function fsArmPillIdle() {
    if (fsIdleTimer) { clearTimeout(fsIdleTimer); fsIdleTimer = null; }
    if (!fsOpen) return;
    fsIdleTimer = setTimeout(function () {
      fsIdleTimer = null;
      // 到点提醒中不收（此刻正需要人看见），其余情况一律淡出

  // ---- 列表渲染 ----
  function cdCardHtml(it) {
    var sec = cdSecLeft(it);
    var ring = it.state === 'running' && sec <= 0;
    var stateTxt = ring ? T('提醒中', 'Ringing') : (it.state === 'paused' ? T('已暂停', 'Paused') : T('进行中', 'Running'));
    var dur = nm(it.durationMs, 0);
    var ratio = dur > 0 ? Math.max(0, Math.min(1, (sec * 1000) / dur)) : 0;
    var paused = it.state === 'paused';
    var primary = paused ? 'resume' : 'pause';
    var primaryTxt = paused ? T('继续', 'Resume') : T('暂停', 'Pause');
    var armed = cdArmDelete === it.id;
    var id = esc(it.id);
    return '<div class="cd-card' + (paused ? ' paused' : '') + (ring ? ' ringing' : '') + '" data-id="' + id + '">'
      + '<div class="cd-row1">'
      +   '<div class="cd-name">' + esc(it.name || T('倒计时', 'Countdown')) + '</div>'
      +   '<button class="cd-icon-btn cd-edit-btn" type="button" data-act="edit" data-id="' + id
      +     '" aria-label="' + esc(T('编辑', 'Edit')) + '">✎</button>'
      +   '<div class="cd-state' + (ring ? ' ringing' : '') + '">' + esc(stateTxt) + '</div>'
      + '</div>'
      + '<div class="cd-time">' + cdClock(sec) + '</div>'
      + '<div class="cd-bar"><i style="width:' + (ratio * 100).toFixed(1) + '%"></i></div>'
      + '<div class="cd-acts">'
      +   '<button type="button" data-act="' + primary + '" data-id="' + id + '">' + esc(primaryTxt) + '</button>'
      +   '<button type="button" data-act="restart" data-id="' + id + '">' + esc(T('重启', 'Restart')) + '</button>'
      +   '<button type="button" class="danger' + (armed ? ' armed' : '') + '" data-act="cancel" data-id="' + id + '">'
      +     esc(armed ? T('确认取消', 'Confirm') : T('取消', 'Cancel')) + '</button>'
      + '</div>'
      + '</div>';
  }
  function renderCdList(force) {
    var items = CDS.items || [];
    var sig = JSON.stringify(items);
    if (!force && sig === cdSig) { cdListVisibility(items.length); return; }
    cdSig = sig;
    el('cd-list').innerHTML = items.map(cdCardHtml).join('');
    cdNodes = {};
    Array.prototype.forEach.call(el('cd-list').querySelectorAll('.cd-card'), function (card) {
      cdNodes[card.getAttribute('data-id')] = {
        card: card,
        time: card.querySelector('.cd-time'),
        bar: card.querySelector('.cd-bar > i'),
        state: card.querySelector('.cd-state'),
        last: null, ring: null,
      };
    });
    cdListVisibility(items.length);
    cdArmedPaint();
  }
  function cdListVisibility(n) {
    var canEdit = !!CDS.canEdit;
    el('cd-empty').hidden = !(n === 0 && canEdit); // 「还没倒计时，在下面添加」只在可写且为空时提示
    el('cd-readonly').hidden = canEdit;            // 不可写就始终挂着说明（有条目时更要说清楚）
    el('cd-form').hidden = !canEdit;
  }
  function cdArmedPaint() {
    Array.prototype.forEach.call(el('cd-list').querySelectorAll('button[data-act="cancel"]'), function (b) {
      var armed = b.getAttribute('data-id') === cdArmDelete;
      b.classList.toggle('armed', armed);
      b.textContent = armed ? T('确认取消', 'Confirm') : T('取消', 'Cancel');
    });
  }

  // ---- 每秒本地倒扣：只改文本与进度条，不重画 DOM ----
  function tickCd() {
    var items = CDS.items || [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i], n = cdNodes[it.id];
      if (!n) continue;
      var sec = cdSecLeft(it);
      var txt = cdClock(sec);
      if (n.last !== txt) { n.time.textContent = txt; n.last = txt; }
      var dur = nm(it.durationMs, 0);
      n.bar.style.width = ((dur > 0 ? Math.max(0, Math.min(1, (sec * 1000) / dur)) : 0) * 100).toFixed(1) + '%';
      var ring = it.state === 'running' && sec <= 0;
      if (n.ring !== ring) {
        n.ring = ring;
        n.card.classList.toggle('ringing', ring);
        n.state.classList.toggle('ringing', ring);
        n.state.textContent = ring ? T('提醒中', 'Ringing')
          : (it.state === 'paused' ? T('已暂停', 'Paused') : T('进行中', 'Running'));
        if (ring) pull(); // 到点 → 立刻拉一次，确认宿主的真实状态
      }
    }
    cdSyncFab();
    if (fsOpen) fsTick(); // 全屏里的读数、橙区宽度、时钟胶囊都靠这一拍
  }

  // ---- 抽屉开合 ----
  function openCd() {
    cdSheetOpen = true;
    if (cdIdleTimer) { clearTimeout(cdIdleTimer); cdIdleTimer = null; }
    el('cd-sheet').style.transform = '';
    el('cd-scrim').style.opacity = '';
    el('cd-scrim').classList.add('show');
    el('cd-sheet').classList.add('show');
    el('cd-sheet').setAttribute('aria-hidden', 'false');
    el('cd-fab').classList.add('hidden-fab');
    cdLangRefresh();
    renderCdList(true);
    tickCd();
    cdVibrate(8);
    pull(); // 免得看到 15 秒前的旧值
  }
  function closeCd() {
    cdSheetOpen = false;
    cdArmDelete = null;
    clearTimeout(cdArmTimer);
    el('cd-scrim').classList.remove('show');
    el('cd-scrim').style.opacity = '';
    el('cd-sheet').classList.remove('show');
    el('cd-sheet').style.transform = '';
    el('cd-sheet').setAttribute('aria-hidden', 'true');
    cdResetForm();
    cdErrClear();
    cdSig = '';
    cdSyncFab();
    cdPokeFab(); // 关掉抽屉 → 胶囊回来，重新开始 3 秒计时
    cdVibrate(6);
  }

  // ---- 表单 ----
  function cdTotalMs() { return (cdDurH * 3600 + cdDurM * 60 + cdDurS) * 1000; }
  function cdFormValid() { var ms = cdTotalMs(); return ms >= CD_MIN_MS && ms <= CD_MAX_MS; }
  function buildChips() {
    el('cd-chips').innerHTML = CD_CHIPS.map(function (s) {
      return '<button type="button" data-sec="' + s + '">' + esc(cdChipLabel(s)) + '</button>';
    }).join('');
  }
  function cdChipLabel(s) {
    if (s % 3600 === 0) return (s / 3600) + T(' 小时', ' hr');
    return (s / 60) + T(' 分钟', ' min');
  }
  function cdSyncForm() {
    var ms = cdTotalMs();
    el('cd-unit-h').textContent = cdDurH;
    el('cd-unit-m').textContent = cdDurM;
    el('cd-unit-s').textContent = cdDurS;
    var total = el('cd-total');
    if (ms < CD_MIN_MS) { total.textContent = T('至少 1 秒', 'At least 1 second'); total.classList.add('warn'); }
    else if (ms > CD_MAX_MS) { total.textContent = T('最多 24 小时', 'At most 24 hours'); total.classList.add('warn'); }
    else { total.textContent = T('共 ', 'Total ') + cdClock(Math.round(ms / 1000)); total.classList.remove('warn'); }
    Array.prototype.forEach.call(el('cd-chips').querySelectorAll('button'), function (b) {
      b.classList.toggle('active', Number(b.getAttribute('data-sec')) * 1000 === ms);
    });
    el('cd-form-title').textContent = cdEditId ? T('编辑倒计时', 'Edit countdown') : T('新建倒计时', 'New countdown');
    el('cd-submit').textContent = cdEditId ? T('保存', 'Save') : T('开始', 'Start');
    el('cd-submit').disabled = cdBusy || !cdFormValid();
    el('cd-edit-cancel').hidden = !cdEditId;
  }
  function cdResetForm() {
    cdEditId = null;
    cdTouched = false;
    el('cd-name').value = '';
    var min = Math.max(1, Math.min(1440, Math.round(nm(CFG.countdownDefaultMinutes, 5))));
    cdAppliedDefault = min;
    cdDurH = Math.floor(min / 60); cdDurM = min % 60; cdDurS = 0;
    cdSyncForm();
  }
  function cdStep(unit, delta) {
    cdTouched = true;
    if (unit === 'h') cdDurH = Math.max(0, Math.min(24, cdDurH + delta));
    else if (unit === 'm') cdDurM = Math.max(0, Math.min(59, cdDurM + delta));
    else if (unit === 's') cdDurS = Math.max(0, Math.min(59, cdDurS + delta));
    cdSyncForm();
  }
  function cdStartEdit(id) {
    var it = null;
    (CDS.items || []).forEach(function (x) { if (x.id === id) it = x; });
    if (!it) return;
    cdEditId = id;
    cdTouched = true;
    el('cd-name').value = it.name || '';
    var sec = Math.max(1, Math.round(nm(it.durationMs, 0) / 1000));
    cdDurH = Math.floor(sec / 3600); cdDurM = Math.floor((sec % 3600) / 60); cdDurS = sec % 60;
    cdSyncForm();
    if (el('cd-form').scrollIntoView) el('cd-form').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    try { el('cd-name').focus(); } catch (e) { /* ignore */ }
  }

  // ---- 动作 ----
  function cdDo(act, id) {
    if (cdBusy) return;
    cdBusy = true; cdErrClear(); cdSyncForm();
    cdWrite('POST', 'countdowns/' + encodeURIComponent(id) + '/' + act, {})
      .then(function (j) { cdApply(j); cdVibrate(10); })
      .catch(function (err) { cdErr(cdErrText(err)); cdVibrate(60); })
      .then(function () { cdBusy = false; cdSyncForm(); });
  }
  function bindCd() {
    el('cd-close').addEventListener('click', closeCd);
    el('cd-scrim').addEventListener('click', closeCd);
    el('fs-pill').addEventListener('click', closeFs); // 全屏里点时钟胶囊 → 回时钟

    // 底部胶囊要装两个动作，用手势区分：单击进全屏、长按开抽屉。
    // 长按期间手指移动超过 10px 视为拖动 → 两个都不触发。
    // ⚠️ 短按**既不能只挂 click，也不能只挂 pointerup**（两个坑都实测踩到了）：
    //    · 只挂 click —— 这一下 pointerdown 会让胶囊进 `:active`（transform → 合成层重建），
    //      真机上整下 click 会跟着被丢掉（和全屏那两颗按钮一模一样的坑）；
    //    · 只挂 pointerup —— 真触摸路径下有时压根收不到 pointerup，长按计时器就没人清，
    //      松手 500ms 后抽屉自己打开（表现成「点一下胶囊变成开抽屉」）。
    //    所以两条路都挂，用 tapHandled 去重：谁先到谁生效，另一个直接忽略。
    //    触发时必须吞掉紧随的 click —— 胶囊这时已经 hidden-fab（display:none），
    //    那一下会落到**同一位置的 #fs-pill（全屏里的时钟胶囊）**上，
    //    触发 closeFs() 把刚打开的全屏当场自己关掉。
    (function bindFabPress() {
      var fab = el('cd-fab'), timer = null, sx = 0, sy = 0;
      var moved = false;
      // ⚠️ 两个「时间窗」而不是布尔标志 —— 布尔标志在「click 被吞掉、压根到不了这里」时
      //    没人复位，就会把下一次正常单击一并吃掉（jsdom 用 .click() 模拟时必踩）。
      var tapUntil = 0;   // 同一次手势去重：pointerup 与紧随的 click 只算一次
      var longUntil = 0;  // 长按刚触发过 → 这一下余波不算单击
      function stop() { if (timer) { clearTimeout(timer); timer = null; } }
      function fireTap() {
        var now = Date.now();
        if (now < tapUntil) return;         // 这一下已经由 pointerup 处理过了
        tapUntil = now + 150;               // 150ms 足够覆盖 pointerup+click 这一对
        if (now < longUntil) return;        // 长按的余波
        if (moved) { moved = false; return; } // 拖过 → 两个都不触发
        swallowTapClick();
        openFs(); // 单击 → 全屏
      }
      fab.addEventListener('pointerdown', function (e) {
        if (e.button && e.button !== 0) return;
        moved = false; sx = e.clientX; sy = e.clientY;
        stop();
        timer = setTimeout(function () {
          timer = null;
          longUntil = Date.now() + 600;
          // 长按一开抽屉，胶囊自己就 hidden-fab 了 → 抬手那下 click 会落到刚铺开的遮罩上，
          // 把抽屉当场又关掉（表现成「长按胶囊没反应」）→ 同样吞掉。
          swallowTapClick();
          openCd(); // 长按 → 抽屉
          cdVibrate(14);
        }, FAB_LONG_MS);
      });
      fab.addEventListener('pointermove', function (e) {
        if (!timer) return;
        if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) { moved = true; stop(); }
      });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) {
        fab.addEventListener(n, function () {
          stop();
          if (n === 'pointerup') fireTap();
        });
      });
      // 兜底（同时也是「只收到 click 的那条路径」）：键盘 Enter/Space 只会给一个 click。
      fab.addEventListener('click', function (e) {
        if (e && e.preventDefault) e.preventDefault();
        stop();
        fireTap();
      });
    })();
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && cdSheetOpen) closeCd();
    });

    // 底部胶囊的「3 秒无操作淡出」：任意触摸 / 点击 / 按键 / 滚动都算操作
    // 同一个「有操作」信号也喂给全屏的「模糊数字」（它按 5 秒算，且只在有交互时取消模糊）
    ['pointerdown', 'touchstart', 'keydown'].forEach(function (t) {
      document.addEventListener(t, cdPokeFab, { passive: true });
      document.addEventListener(t, fsPokeBlur, { passive: true });
    });
    window.addEventListener('scroll', cdPokeFab, { passive: true });
    window.addEventListener('scroll', fsPokeBlur, { passive: true });

    // 列表动作（事件委托，重画后依然有效）
    el('cd-list').addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
      if (!btn) return;
      var id = btn.getAttribute('data-id'), act = btn.getAttribute('data-act');
      if (act === 'edit') { cdStartEdit(id); return; }
      if (act === 'cancel' && cdArmDelete !== id) { // 先「武装」再删除，避免误触
        cdArmDelete = id;
        cdVibrate(14);
        cdArmedPaint();
        clearTimeout(cdArmTimer);
        cdArmTimer = setTimeout(function () { cdArmDelete = null; cdArmedPaint(); }, 3500);
        return;
      }
      cdArmDelete = null;
      clearTimeout(cdArmTimer);
      cdDo(act, id);
    });

    // 快捷片
    el('cd-chips').addEventListener('click', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('button[data-sec]') : null;
      if (!b) return;
      var sec = Number(b.getAttribute('data-sec'));
      cdTouched = true;
      cdDurH = Math.floor(sec / 3600); cdDurM = Math.floor((sec % 3600) / 60); cdDurS = sec % 60;
      cdVibrate(5);
      cdSyncForm();
    });

    // 步进器：单击 ±1，按住 400ms 后连加（长按调时间不用点几百次）
    var units = document.querySelector('.cd-units');
    var holdTimer = null, repTimer = null;
    function stopHold() { clearTimeout(holdTimer); clearInterval(repTimer); holdTimer = repTimer = null; }
    units.addEventListener('pointerdown', function (e) {
      var b = e.target && e.target.closest ? e.target.closest('button[data-unit]') : null;
      if (!b) return;
      var unit = b.getAttribute('data-unit'), delta = Number(b.getAttribute('data-delta'));
      cdStep(unit, delta);
      cdVibrate(4);
      stopHold();
      holdTimer = setTimeout(function () {
        repTimer = setInterval(function () { cdStep(unit, delta); }, 110);
      }, 400);
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (t) { units.addEventListener(t, stopHold, true); });
    window.addEventListener('blur', stopHold);
    units.addEventListener('click', function (e) { // 点按已在 pointerdown 处理，这里只吞掉默认行为
      var b = e.target && e.target.closest ? e.target.closest('button[data-unit]') : null;
      if (b) { e.preventDefault(); e.stopPropagation(); }
    });

    // 提交（新建 / 保存编辑）
    el('cd-form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (cdBusy) return;
      if (!cdFormValid()) { cdErr(T('时长需要在 1 秒 ~ 24 小时之间', 'Duration must be 1s – 24h')); return; }
      var editing = cdEditId;
      var payload = { durationMs: cdTotalMs() };
      var nmv = el('cd-name').value.trim();
      if (nmv) payload.name = nmv;
      cdBusy = true; cdErrClear(); cdSyncForm();
      var p = editing
        ? cdWrite('PATCH', 'countdowns/' + encodeURIComponent(editing), payload)
        : cdWrite('POST', 'countdowns', payload);
      p.then(function (j) {
        cdApply(j);
        cdVibrate([10, 26, 10]);
        cdEditId = null;
        el('cd-name').value = '';
        cdSyncForm();
        var last = el('cd-list').lastElementChild;
        if (last && last.scrollIntoView) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }).catch(function (err) {
        cdErr(cdErrText(err));
        cdVibrate(60);
      }).then(function () { cdBusy = false; cdSyncForm(); });
    });

    el('cd-edit-cancel').addEventListener('click', function () { cdResetForm(); cdErrClear(); });

    // 下滑关闭：只在抓手与标题栏生效，抽屉内容区仍可正常滚动
    bindSheetDrag(el('cd-sheet'), el('cd-scrim'), closeCd);
  }

  // ==================== [v1.0.5.7] 手机端提示音 ====================
  // 设计要点：
  //   · 开关与音色只写本机 localStorage —— 与桌面端的 countdownSound 完全无关，
  //     也不走快照（宿主既不知道也不需要知道手机要不要响）
  //   · 零外部资源：三种音色全部用 Web Audio 现场合成，页面依旧自包含
  //   · 浏览器要求用户手势之后才允许出声 → 任意触摸/按键静默解锁，点按钮时也解锁
  //   · 响一小段（3 遍）后音频自动停；震动持续到用户点「知道了」或 90 秒上限
  var LS_SOUND = 'dc.cdSound', LS_KIND = 'dc.cdSoundKind';
  var CD_KINDS = ['beep', 'chime', 'alarm'];
  var CD_KIND_LABEL = { beep: ['蜂鸣', 'Beep'], chime: ['铃音', 'Chime'], alarm: ['闹钟', 'Alarm'] };
  var CD_ALERT_MS = 90000, CD_ALERT_REPEAT = 3, CD_ALERT_GAP_MS = 1000;

  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* 隐私模式：当次会话内有效即可 */ } }
  // 删键（而不是写空串）：「恢复默认」要真的回到「从没设过」的状态
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* 同上 */ } }
  function cdSoundOn() { return lsGet(LS_SOUND) !== '0'; }   // 默认开：提醒类功能默认可用，用户可关
  function cdSoundKind() {
    var k = String(lsGet(LS_KIND) || '');
    return CD_KINDS.indexOf(k) >= 0 ? k : 'beep';
  }

  // ---- Web Audio：三种提示音，全部现场合成 ----
  var cdCtx = null, cdUnlocked = false;
  function cdAudioCtx() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!cdCtx) { try { cdCtx = new AC(); } catch (e) { return null; } }
    return cdCtx;
  }
  function cdUnlockAudio() {
    if (cdUnlocked) return true;
    var c = cdAudioCtx();
    if (!c) return false;
    try { if (c.state === 'suspended' && c.resume) c.resume(); } catch (e) { /* 忽略 */ }
    if (c.state === 'running') cdUnlocked = true;
    return cdUnlocked;
  }
  function cdTone(c, freq, at, dur, type, peak) {
    var o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.connect(g); g.connect(c.destination);
    o.start(at); o.stop(at + dur + 0.03);
  }
  // 播一遍当前音色；返回是否真的排上了音（未解锁 / 无 Web Audio 时为 false）
  function cdPlayOnce() {
    var c = cdAudioCtx();
    if (!c || !cdUnlocked || c.state !== 'running') return false;
    var t = c.currentTime + 0.02, k = cdSoundKind(), i;
    try {
      if (k === 'chime') {
        cdTone(c, 1046.5, t,        0.55, 'sine', 0.22);
        cdTone(c, 1318.5, t + 0.16, 0.55, 'sine', 0.20);
        cdTone(c, 1568.0, t + 0.32, 0.80, 'sine', 0.18);
      } else if (k === 'alarm') {
        for (i = 0; i < 8; i++) cdTone(c, i % 2 ? 1000 : 800, t + i * 0.16, 0.12, 'square', 0.16);
      } else {
        cdTone(c, 880, t,        0.14, 'sine', 0.28);
        cdTone(c, 880, t + 0.26, 0.14, 'sine', 0.28);
      }
    } catch (e) { return false; }
    return true;
  }
  var cdAudioTimers = [];
  function cdStopAudio() { while (cdAudioTimers.length) clearTimeout(cdAudioTimers.pop()); }
  function cdPlayAlert() {
    cdStopAudio();
    if (!cdSoundOn()) return;
    cdUnlockAudio();
    var n = 0;
    function fire() {
      if (!cdAlert.active || n >= CD_ALERT_REPEAT) return;
      n++;
      cdPlayOnce();
      cdAudioTimers.push(setTimeout(fire, CD_ALERT_GAP_MS));
    }
    fire();
  }
  // 试听（点开关 / 点音色时用）
  function cdPreview() { cdUnlockAudio(); cdStopAudio(); cdPlayOnce(); }

  // ---- 震动：比音频长得多，持续到用户处理 ----
  var cdVibTimer = null;
  function cdVibStart() {
    cdVibStop();
    var beat = function () { cdVibrate([220, 120, 220]); };
    beat();
    cdVibTimer = setInterval(beat, 1300);
  }
  function cdVibStop() { if (cdVibTimer) { clearInterval(cdVibTimer); cdVibTimer = null; } }

  // ---- 到点提醒：横幅 + 声音 + 震动 ----
  // ⚠️ 检测基于 CDS.items 而不是卡片 DOM —— 抽屉关着时 cdNodes 是空的，也必须能响
  var cdAlert = { active: false, id: null, name: '', timer: null };
  var cdRungIds = {};

  function cdAlertStart(it) {
    cdAlert.active = true;
    cdAlert.id = it.id;
    cdAlert.name = it.name || T('倒计时', 'Countdown');
    cdPokeFab(); // 到点了 → 把胶囊唤出来，且提醒期间不自动收起
    el('cd-alert-name').textContent = cdAlert.name;
    el('cd-alert-sub').textContent = T('时间到了', 'Time is up');
    el('cd-alert').classList.remove('hidden');
    el('cd-alert').classList.remove('show');
    void el('cd-alert').offsetWidth; // 强制重排，让「连着两个到点」时动画能重放
    el('cd-alert').classList.add('show');
    cdPlayAlert();
    if (cdSoundOn()) cdVibStart(); // 关掉提示音 = 要安静：连震动一起停，只留视觉横幅
    if (cdAlert.timer) clearTimeout(cdAlert.timer);
    cdAlert.timer = setTimeout(cdAlertStop, CD_ALERT_MS);
  }
  function cdAlertStop() {
    if (cdAlert.timer) { clearTimeout(cdAlert.timer); cdAlert.timer = null; }
    cdAlert.active = false; cdAlert.id = null;
    cdStopAudio();
    cdVibStop();
    el('cd-alert').classList.remove('show');
    el('cd-alert').classList.add('hidden');
    cdPokeFab(); // 提醒结束 → 胶囊恢复「3 秒无操作才淡出」的节奏
  }
  function cdAlertTick() {
    var items = CDS.items || [], seen = {}, first = null, i, it, ring;
    for (i = 0; i < items.length; i++) {
      it = items[i];
      ring = it.state === 'running' && cdSecLeft(it) <= 0;
      if (!ring) continue;
      seen[it.id] = 1;
      if (!cdRungIds[it.id]) { cdRungIds[it.id] = 1; if (!first) first = it; }
    }
    // 不再处于「到点」状态的 id 要放掉，否则重启同一个倒计时后不会再提醒
    for (var k in cdRungIds) if (!seen[k]) delete cdRungIds[k];
    if (first) cdAlertStart(first);
  }

  // ---- 提示音按钮 ----
  function cdSoundPaint() {
    var on = cdSoundOn(), k = cdSoundKind();
    var btn = el('cd-sound-btn'), chip = el('cd-sound-kind');
    btn.textContent = on ? '🔔' : '🔕';
    btn.classList.toggle('off', !on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', T(on ? '提示音已开，点击关闭' : '提示音已关，点击开启',
                                    on ? 'Sound on — tap to mute' : 'Sound off — tap to enable'));
    var lb = CD_KIND_LABEL[k];
    chip.textContent = lb ? lb[ZH() ? 0 : 1] : k;
    chip.classList.toggle('off', !on);
    chip.setAttribute('aria-label', T('提示音音色：' + k + '，点击切换',
                                      'Alert sound: ' + k + ' — tap to change'));
  }
  function bindCdSound() {
    el('cd-sound-btn').addEventListener('click', function () {
      var on = !cdSoundOn();
      lsSet(LS_SOUND, on ? '1' : '0');
      if (on) cdPreview(); else { cdStopAudio(); cdVibStop(); }
      cdSoundPaint();
    });
    el('cd-sound-kind').addEventListener('click', function () {
      if (!cdSoundOn()) lsSet(LS_SOUND, '1'); // 调音色 = 想要声音，顺手打开
      var i = CD_KINDS.indexOf(cdSoundKind());
      lsSet(LS_KIND, CD_KINDS[(i + 1) % CD_KINDS.length]);
      cdPreview();
      cdSoundPaint();
    });
    el('cd-alert-stop').addEventListener('click', function () { cdAlertStop(); cdVibrate(20); });
    // 任意手势静默解锁音频。幂等：解锁后直接短路，常量级开销
    ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, function () {
        if (cdUnlocked || !cdSoundOn()) return;
        cdUnlockAudio();
      }, { passive: true });
    });
  }

  // ==================== [v1.0.5.7] 长按时钟 → 手机端显示面板 ====================
  // 这个面板存在的两个理由：
  //   · 倒计时未激活时底部胶囊会完全隐藏 → 「新建倒计时」需要一个替代入口
  //   · 手机端字号是本机偏好（与桌面端无关），又不想在屏幕上常驻一个按钮

  function bindSheetDrag(sheet, scrim, closer) {
    var sy = 0, dy = 0, dragging = false;

      if (e.target && e.target.closest && e.target.closest('button')) return;
      dragging = true; sy = e.clientY; dy = 0;
      sheet.style.transition = 'none';
      try { if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}

    function move(e) {
      if (!dragging) return;
      dy = Math.max(0, e.clientY - sy);
      sheet.style.transform = 'translateY(' + dy + 'px)';
      scrim.style.opacity = String(Math.max(0, 1 - dy / 340));
      if (e.cancelable) e.preventDefault();
    }
    function end() {
      if (!dragging) return;
      dragging = false;
      sheet.style.transition = '';
      scrim.style.opacity = '';
      sheet.style.transform = '';
      if (dy > 88) closer();
      dy = 0;
    }
    [sheet.querySelector('.cd-grab'), sheet.querySelector('.cd-head')].forEach(function (node) {
      if (!node) return;
      node.addEventListener('pointerdown', start);
      node.addEventListener('pointermove', move);
      node.addEventListener('pointerup', end);
      node.addEventListener('pointercancel', end);
    });

  // 双击之后浏览器还会补一次 click。这次 click 的落点是**按新布局重新命中**的：
  // 面板一弹出，遮罩（#ui-scrim）就铺满全屏并开始接收指针 → 这一下会正好点在遮罩上，
  // 把刚打开的面板自己关掉（实测：面板出现后 83ms 就被点没了，表现成「双击没反应」）。
  // 兜底：双击触发后的一小段窗口内，把 document 上捕获到的 click 全部吞掉。
  // 窗口只有 450ms（人抬手后不可能在这么短时间里再点一次），不会伤到正常点击。
  function swallowTapClick() {
    var until = Date.now() + 450;
    function sw(e) {
      if (Date.now() > until) { document.removeEventListener('click', sw, true); return; }
      e.stopPropagation(); e.preventDefault();
    }
    document.addEventListener('click', sw, true);
    setTimeout(function () { document.removeEventListener('click', sw, true); }, 460);
  }

  // 双击：两次「按下」间隔 ≤ 320ms、位移 ≤ 40px 就算数。时钟与全屏大数字共用这一段。
  // ⚠️ 判定放在**第二次按下的瞬间**（不等抬手、不等 click）：
  //    真机上抬手那一下容易被合成层变动吞掉（上一次全屏按钮「第一下没反应」就是这个坑），
  //    按下即触发就从根上不依赖 up/click 的配对。
  function bindDoubleTap(target, onFire) {
    if (!target) return;
    var last = 0, lx = 0, ly = 0;
    function down(e) {
      if (e && typeof e.button === 'number' && e.button > 0) return; // 只认主键/单指
      if (e && e.touches && e.touches.length > 1) { last = 0; return; } // 双指 → 作废
      var t = (e && e.touches && e.touches[0]) || e || {};
      var x = nm(t.clientX, 0), y = nm(t.clientY, 0), now = Date.now();
      if (last && now - last <= DOUBLE_TAP_MS
        && Math.abs(x - lx) <= DOUBLE_TAP_DIST && Math.abs(y - ly) <= DOUBLE_TAP_DIST) {
        last = 0; // 用完即清：三连击不会连着开两次
        swallowTapClick();
        onFire();
        return;
      }

    var touchAt = 0;

    uiPaintLabel();
    uiPaintClock(); // chips 里的文案是动态生成的，语言变了要重建
    el('ui-close').setAttribute('aria-label', T('关闭', 'Close'));
    el('ui-minus').setAttribute('aria-label', T('缩小', 'Smaller'));
    el('ui-plus').setAttribute('aria-label', T('放大', 'Larger'));
    el('ui-reset').textContent = T('恢复默认', 'Reset');
    el('ui-new-cd').textContent = T('新建倒计时', 'New countdown');
    el('hint').textContent = T('双击时钟可调整字体与动画', 'Double-tap the clock for font & animation');
  }

  // 语言 / 配置变化时刷新文案
  function cdLangRefresh() {
    buildChips();
    el('cd-empty').textContent = T('还没有倒计时，在下面添加一个', 'No countdowns yet — add one below');
    el('cd-readonly').textContent = T('当前时钟未开放手机端修改倒计时', 'Editing countdowns is disabled on this clock');
    el('cd-close').setAttribute('aria-label', T('关闭', 'Close'));
    el('cd-title').textContent = T('倒计时', 'Countdown');
    el('cd-fab').setAttribute('aria-label', T('倒计时', 'Countdown'));
    el('cd-name').setAttribute('placeholder', T('名称（可选）', 'Name (optional)'));
    el('cd-edit-cancel').textContent = T('取消编辑', 'Cancel edit');
    cdSyncForm();
    cdSig = '';
    cdFabSig = ''; // 语言变了 → 胶囊文案缓存作废（「提醒中」等字样要跟着换）
    cdSoundPaint();
    uiLangRefresh();
    if (cdSheetOpen) renderCdList(true);
    else cdListVisibility((CDS.items || []).length);
    cdSyncFab();
    if (fsOpen) { fsId = null; fsTick(); } // 全屏里的名字也要跟着换语言
    fsActsSig = ''; fsPaintActs();         // 右下角两个按钮的无障碍语义也跟着换（暂停/继续 · 取消/确认）
    el('fs-pill').setAttribute('aria-label', T('返回时钟', 'Back to clock')); // 顶部时间胶囊的读屏标签
  }

  cdResetForm();
  bindCd();
  bindFs();
  bindCdSound();
  bindDoubleTaps();
  bindUi();
  cdLangRefresh();
  fsApplyAccent(); // 水位条颜色是本机偏好，进页面就按它上色
  el('cd-sheet').setAttribute('aria-hidden', 'true');
  el('ui-sheet').setAttribute('aria-hidden', 'true');
  setInterval(tickCd, 1000);
  setInterval(cdAlertTick, 1000); // 到点提醒独立于卡片 DOM，抽屉关着也要能响
  cdPokeFab(); // 进页面先让胶囊露个面，之后 3 秒没动静再淡出

  applyStatic();
  tick();
  setStatus();
  pull();
  setInterval(pull, POLL_MS);
  showHintOnce(); // 「长按时钟可调字号」只提示一次（本机记忆）
})();
</script></body>
</html>
