<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>Digital Clock</title>
<style>
  /* 手机端镜像页：完全自包含（内联样式与脚本、零外部资源），断网也能打开。
     颜色 / 字号 / 12-24 小时制 / 时区 / 昼夜自动配色 / 动画家族与方向都跟随桌面配置；
     访问码来自地址栏路径，页面自身不拼任何外部地址。 */
  /* ⚠️ 这里**不要**给 --anim-ease 写兜底值：节奏走的是「元素上没有该变量 → 各条 transition
     用自己的原曲线」这套 fallback 机制（见 renderer.js / 页面里 applyAnimVars 的注释），
     在 :root 上写一个值会被继承下去，等于把「弹性」档变成写死某一个曲线。 */
  :root { --anim-duration: 350ms; --dim: rgba(255,255,255,.45); --page: #0a0c11; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--page); color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    transition: background .5s ease, color .5s ease;
  }
  body::before {
    content: ""; position: fixed; inset: -25%; pointer-events: none;
    background:
      radial-gradient(55% 45% at 50% 28%, rgba(120,150,255,.16), transparent 72%),
      radial-gradient(50% 40% at 72% 82%, rgba(255,120,180,.10), transparent 72%);
    transition: opacity .5s ease;
  }
  body.is-day { --page: #eef1f6; --dim: rgba(0,0,0,.42); color: #111; }
  body.is-day::before { opacity: .35; }

  #clock {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(4px, 1.4vh, 14px); max-width: 100%;
    /* 双击时钟 = 打开显示设置：touch-action:manipulation 关掉「双击缩放」，
       免得系统把第二下当成缩放手势吞掉；user-select 关掉双击选词 */
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  #clock.date-above { flex-direction: column-reverse; }

  #time-display {
    position: relative; display: flex; align-items: center; justify-content: center;
    padding: .04em .1em; border-radius: .05em; line-height: 1;
    transition: color .5s ease, background-color .5s ease;
  }
  #digits { display: inline-flex; align-items: center; gap: .06em; line-height: 1; white-space: nowrap; }

  /* ====== 数字位 / 动画：与桌面 styles.css 同源，保证观感一致 ====== */
  .digit-group {
    position: relative; display: inline-block; height: 1.1em; overflow: hidden;
    vertical-align: middle; font-variant-numeric: tabular-nums;
  }
  .digit-current { display: block; line-height: 1.1em; height: 1.1em; text-align: center; will-change: transform, opacity; }
  .digit-current.animate-out {
    transform: translateY(-100%); opacity: 0;
    transition: transform var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1)), opacity var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1));
  }
  .digit-next {
    position: absolute; top: 0; left: 0; width: 100%; height: 1.1em; line-height: 1.1em;
    text-align: center; transform: translateY(100%); opacity: 0; will-change: transform, opacity;
  }
  .digit-next.animate-in {
    transform: translateY(0); opacity: 1;
    transition: transform var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1)), opacity var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1));
  }
  .anim-flip.dir-down .digit-next { transform: translateY(-100%); }
  .anim-flip.dir-down .digit-current.animate-out {
    transform: translateY(100%); opacity: 0;
    transition: transform var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1)), opacity var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1));
  }
  .anim-flip.dir-down .digit-next.animate-in { transform: translateY(0); opacity: 1; }
  .anim-fade .digit-next { transform: none; }
  .anim-fade .digit-current.animate-out { transform: none; opacity: 0; transition: opacity var(--anim-duration,350ms) var(--anim-ease, ease); }
  .anim-fade .digit-next.animate-in { transform: none; opacity: 1; transition: opacity var(--anim-duration,350ms) var(--anim-ease, ease); }
  .anim-scale.dir-shrink .digit-current.animate-out {
    transform: scale(.3); opacity: 0;
    transition: transform var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1)), opacity var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1));
  }
  .anim-scale.dir-shrink .digit-next { transform: none; }
  .anim-scale.dir-shrink .digit-next.animate-in { transform: none; opacity: 1; transition: opacity var(--anim-duration,350ms) var(--anim-ease, ease); }
  .anim-scale.dir-grow .digit-current.animate-out {
    transform: scale(1.5); opacity: 0;
    transition: transform var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1)), opacity var(--anim-duration,350ms) var(--anim-ease, cubic-bezier(.34,1.56,.64,1));
  }
  .anim-scale.dir-grow .digit-next { transform: none; }
  .anim-scale.dir-grow .digit-next.animate-in { transform: none; opacity: 1; transition: opacity var(--anim-duration,350ms) var(--anim-ease, ease); }
  .anim-flip-3d .digit-group { perspective: 400px; }
  .anim-flip-3d .digit-current { transform-origin: bottom center; backface-visibility: hidden; }
  .anim-flip-3d .digit-next { transform-origin: top center; backface-visibility: hidden; transform: rotateX(-90deg); opacity: 0; }
  .anim-flip-3d .digit-current.animate-out {
    transform: rotateX(90deg); opacity: 0;
    transition: transform var(--anim-duration,350ms) ease-in, opacity var(--anim-duration,350ms) ease-in;
  }
  .anim-flip-3d .digit-next.animate-in {
    transform: rotateX(0deg); opacity: 1;
    transition: transform var(--anim-duration,350ms) ease-out, opacity var(--anim-duration,350ms) ease-out;
  }
  .colon {
    display: inline-flex; align-items: center; justify-content: center;
    vertical-align: middle; margin: 0 .02em; animation: breathe 1s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  /* ====== 信息栏 ====== */
  .info-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: .5em 1em; padding: .06em .3em; border-radius: .06em;
    opacity: .92; line-height: 1.3;
    transition: color .5s ease, background-color .5s ease;
  }
  .info-bar:empty { display: none; }

  /* ====== AM / PM 角标：手机端钉在屏幕角上，避免压住数字 ====== */
  #ampm {
    position: fixed; line-height: 1; font-weight: 500; letter-spacing: .5px;
    opacity: .7; pointer-events: none; display: none;
  }
  #ampm.show { display: block; }
  #ampm.top-left { top: calc(14px + env(safe-area-inset-top)); left: 16px; }
  #ampm.top-right { top: calc(14px + env(safe-area-inset-top)); right: 16px; }
  #ampm.bottom-left { bottom: calc(30px + env(safe-area-inset-bottom)); left: 16px; }
  #ampm.bottom-right { bottom: calc(30px + env(safe-area-inset-bottom)); right: 16px; }

  /* ====== 底部状态 ====== */
  #foot {
    position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11px; color: var(--dim); letter-spacing: .3px; pointer-events: none;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #3ac569;
    box-shadow: 0 0 8px rgba(58,197,105,.85); transition: background .3s ease, box-shadow .3s ease;
  }
  .dot.off { background: #e0685a; box-shadow: 0 0 8px rgba(224,104,90,.85); }

  /* ====== [v1.0.5.7] 倒计时：底部胶囊 + 上拉抽屉 ====== */
  /* 手机端全部按触控设计：可点目标 ≥44px、不吃 300ms 延迟、下拉不穿透到页面、
     键盘弹出时抽屉可用 safe-area 顶开。颜色沿用页面的深色玻璃 / 昼间两套。 */
  :root {
    --glass: rgba(255,255,255,.075);
    --glass-2: rgba(255,255,255,.14);
    --sheet: rgba(15,17,24,.94);
    --line: rgba(255,255,255,.14);
    --ink: #fff;
    --ink-dim: rgba(255,255,255,.55);
    --accent: #8f7bff;
    --danger: #ff7a7a;
  }
  body.is-day {
    --glass: rgba(0,0,0,.045);
    --glass-2: rgba(0,0,0,.08);
    --sheet: rgba(250,251,253,.96);
    --line: rgba(0,0,0,.12);
    --ink: #111;
    --ink-dim: rgba(0,0,0,.55);
    --accent: #6a55e0;
    --danger: #d64545;
  }
  /* [v1.0.5.7] 位置与全屏里的时钟胶囊（#fs-pill）**完全一致**：顶部居中。
     两处同位 → 「点胶囊放大进全屏 / 再点缩回时钟」的形变动画首尾相接，
     看起来就是同一颗玻璃在长大、缩小（见 #fs-morph）。 */
  #cd-fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; gap: 7px;
    min-height: 44px; padding: 0 18px;
    border-radius: 999px; border: 1px solid var(--line);
    background: var(--glass); color: var(--ink);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 14px; font-weight: 500; letter-spacing: .2px;
    font-variant-numeric: tabular-nums;
    cursor: pointer; touch-action: manipulation;
    /* ⚠️ --fab-pct 的过渡必须写在**元素自己**身上：值是在 #cd-fab 上被改写的，
       伪元素只是「读」它（继承来的），在伪元素上写 transition 是无效的。
       注册成 @property 之后它才可插值 → 断点位置也能 1s 线性地退。 */
    transition: transform .18s cubic-bezier(.34,1.4,.64,1), background .2s ease,
                opacity .26s ease, --fab-pct 1s linear;
    /* [v1.0.5.7] 胶囊上「按剩余比例上色」那条色块的两个端点（夜 / 昼）：
       用户调背景色时由 fsApplyAccent() 按同一色相写成 hsla() 覆盖。
       默认跟水位条的默认橙同源。 */
    --fab-a: hsla(25, 85%, 60%, .20);
    --fab-da: hsla(25, 80%, 45%, .14);
  }
  /* [v1.0.5.7] 有倒计时**在跑**、又没进全屏时：胶囊也做成「一部分有色 + 一部分无色玻璃」，
     与全屏水位条是同一套语言 —— **有色部分的宽度 = 剩余时间比例**（每秒跟着退），
     不是固定一半。颜色压得很淡（~1/5）：只当状态提示，不抢读数。
     用伪元素 + @property 注册 --fab-pct：渐变的断点位置也能 1s 线性过渡，像水位在退
     （CSS 变量默认不可过渡，注册成 <percentage> 之后才行；老浏览器忽略 @property 只是
     断点会跳变，仍然能用）。
     ⚠️⚠️ inherits 必须是 true：伪元素是**靠继承**拿父元素自定义属性的，
     写成 false 时 #cd-fab::before 只能取到 initial-value(0%) → 色块宽度归 0 → 颜色整个看不见
     （实测踩过：真机上「淡淡的颜色」突然没了，而测试仍全绿）。 */
  @property --fab-pct {
    syntax: '<percentage>'; inherits: true; initial-value: 0%;
  }
  #cd-fab::before {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(90deg,
      var(--fab-a) 0 var(--fab-pct), transparent var(--fab-pct) 100%);
    opacity: 0; pointer-events: none;
    /* 只过渡「点亮」这一步；断点的 1s 退色由元素自身的 --fab-pct 过渡提供（见上） */
    transition: opacity .24s ease;
  }
  #cd-fab.fab-live::before { opacity: 1; }
  body.is-day #cd-fab::before {
    background: linear-gradient(90deg,
      var(--fab-da) 0 var(--fab-pct), transparent var(--fab-pct) 100%);
  }
  /* 伪元素是绝对定位、盖在内容之上 → 文本要抬到它上面 */
  #cd-fab > * { position: relative; z-index: 1; }
  #cd-fab:active { transform: translateX(-50%) scale(.94); }
  #cd-fab.has { background: var(--glass-2); }
  #cd-fab.paused { opacity: .75; }
  #cd-fab .cd-fab-num { font-size: 15px; font-weight: 600; }
  /* 空态（一条倒计时都没有）：胶囊 = 新建入口，去掉漏斗图标免得跟「＋」打架 */
  #cd-fab.empty > span[aria-hidden="true"] { display: none; }
  #cd-fab .cd-fab-empty { font-size: 14px; font-weight: 600; }
  #cd-fab .cd-fab-more { font-size: 12px; color: var(--ink-dim); }
  /* 3 秒没操作 → 自动淡出；屏幕上任何一次操作都会立刻唤回来。
     胶囊在顶部 → 藏的方向是**向上**收（与 #fs-pill.idle 一致）。 */
  #cd-fab.idle {
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateX(-50%) translateY(-140%) scale(.96);
    transition: opacity .3s ease, visibility .3s, transform .34s cubic-bezier(.4,0,.2,1);
  }

  #cd-scrim, #ui-scrim {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,.45); opacity: 0; pointer-events: none;
    transition: opacity .26s ease;
  }
  #cd-scrim.show, #ui-scrim.show { opacity: 1; pointer-events: auto; }

  #cd-sheet, #ui-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
    max-height: 88vh; display: flex; flex-direction: column;
    background: var(--sheet); color: var(--ink);
    border-radius: 22px 22px 0 0;
    border-top: 1px solid var(--line);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
    transform: translateY(102%);
    transition: transform .32s cubic-bezier(.32,1.02,.4,1);
    padding-bottom: env(safe-area-inset-bottom);
    overscroll-behavior: contain;
  }
  #cd-sheet.show, #ui-sheet.show { transform: translateY(0); }
  /* 手机端显示面板：比倒计时抽屉矮得多，一屏就够 */
  #ui-sheet { max-height: 70vh; }
  #ui-sheet .cd-body { padding: 4px 16px calc(16px + env(safe-area-inset-bottom)); }

  .ui-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 6px 0 2px;
  }
  .ui-row-label { font-size: 14px; font-weight: 500; }
  .ui-stepper { display: flex; align-items: center; gap: 6px; }
  .ui-stepper button {
    width: 46px; min-height: 46px; border-radius: 13px; cursor: pointer;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    font-size: 20px; line-height: 1; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .ui-stepper button:active { background: var(--glass-2); transform: scale(.94); }
  .ui-stepper button[disabled] { opacity: .35; }
  .ui-stepper .ui-val {
    min-width: 62px; text-align: center; font-size: 16px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .ui-scale-bar {
    display: flex; align-items: center; gap: 8px; margin-top: 12px;
  }
  .ui-scale-bar .ui-track {
    flex: 1 1 auto; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden;
  }
  .ui-scale-bar .ui-fill { height: 100%; background: var(--accent); transition: width .16s ease; }
  .ui-hint { font-size: 12px; color: var(--ink-dim); margin-top: 10px; line-height: 1.5; }
  .ui-acts { display: flex; gap: 10px; margin-top: 16px; }
  .ui-acts button {
    flex: 1; min-height: 48px; border-radius: 14px; cursor: pointer;
    font-size: 15px; font-weight: 500; touch-action: manipulation;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
  }
  .ui-acts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ui-acts button:active { transform: scale(.97); }
  .ui-acts button[hidden] { display: none !important; }

  /* ====== [v1.0.5.7] 全屏倒计时专属的两项设置（模糊秒数 + 水位条配色）======
     只在「双击全屏大数字」进来的面板里出现；双击主界面时钟的面板保持原样。 */
  .ui-block[hidden] { display: none !important; }
  .ui-block { margin-top: 6px; border-top: 1px solid var(--line); }

  /* 开关：只用 aria-checked 当唯一事实来源，样式全从它派生 */
  .ui-switch {
    position: relative; flex: 0 0 auto; width: 52px; height: 32px; padding: 0;
    border-radius: 999px; border: 1px solid var(--line); background: var(--glass);
    cursor: pointer; touch-action: manipulation;
    transition: background .18s ease, border-color .18s ease;
  }
  .ui-switch .ui-knob {
    position: absolute; top: 50%; left: 3px; width: 24px; height: 24px; margin-top: -12px;
    border-radius: 50%; background: var(--ink); opacity: .78;
    transition: transform .24s cubic-bezier(.34,1.4,.64,1), background .18s ease, opacity .18s ease;
  }
  .ui-switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
  .ui-switch[aria-checked="true"] .ui-knob { transform: translateX(20px); background: #fff; opacity: 1; }
  .ui-switch:active .ui-knob { transform: scale(.92); }
  .ui-switch[aria-checked="true"]:active .ui-knob { transform: translateX(20px) scale(.92); }

  .ui-mini {
    flex: 0 0 auto; min-height: 36px; padding: 0 14px; border-radius: 11px; cursor: pointer;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    font-size: 12px; font-weight: 500; touch-action: manipulation;
  }
  .ui-mini:active { transform: scale(.94); }

  /* 自定义字体名的输入行（只在点开「自定义…」后出现） */
  .ui-font-custom { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .ui-font-custom[hidden] { display: none !important; }
  .ui-font-custom input {
    flex: 1 1 auto; min-width: 0; min-height: 44px; padding: 0 12px;
    border-radius: 12px; border: 1px solid var(--line); box-sizing: border-box;
    background: var(--glass); color: var(--ink); font-size: 14px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .ui-font-custom input:focus { border-color: var(--accent); }

  /* 色相滑块：轨道是一整圈彩虹，圆点显示当前色。自己画（不用原生 range），
     触控拖动与视觉风格都更可控；touch-action:none 防止拖动时把抽屉带着滚。 */
  .ui-hue { position: relative; height: 40px; margin-top: 8px; touch-action: none; cursor: pointer; outline: none; }
  .ui-hue:focus-visible .ui-hue-knob { box-shadow: 0 0 0 3px var(--accent), 0 2px 8px rgba(0,0,0,.4); }
  .ui-hue-track {
    position: absolute; left: 0; right: 0; top: 50%; height: 12px; margin-top: -6px;
    border-radius: 6px; border: 1px solid var(--line); box-sizing: border-box;
    background: linear-gradient(90deg,#ff0000,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);
  }
  .ui-hue-knob {
    position: absolute; top: 50%; left: 6.7%; width: 26px; height: 26px;
    margin-top: -13px; margin-left: -13px; border-radius: 50%;
    border: 3px solid #fff; background: #f97316; pointer-events: none;
    box-shadow: 0 2px 8px rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.22);
  }

  /* 首次进页面的一次性提示（手势的发现性靠它） */
  #hint {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(54px + env(safe-area-inset-bottom));
    z-index: 29; max-width: 88vw;
    padding: 8px 14px; border-radius: 999px;
    background: var(--glass-2); color: var(--ink);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 12px; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  #hint.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #hint[hidden] { display: none !important; }
  .cd-grab {
    flex: 0 0 auto; width: 40px; height: 4px; border-radius: 2px;
    background: var(--line); margin: 9px auto 2px;
  }
  .cd-head {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px 6px;
  }
  .cd-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .cd-icon-btn {
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    border: none; background: none; color: var(--ink-dim);
    font-size: 18px; border-radius: 12px; cursor: pointer;
    touch-action: manipulation;
  }
  .cd-body {
    flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding: 2px 16px 18px;
  }
  .cd-empty { color: var(--ink-dim); font-size: 13px; padding: 10px 2px 14px; text-align: center; }

  /* ---- 倒计时卡片 ---- */
  .cd-card {
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--glass); padding: 12px 13px; margin-bottom: 10px;
    transition: border-color .2s ease, transform .16s cubic-bezier(.34,1.4,.64,1);
  }
  .cd-card:active { transform: scale(.985); }
  .cd-card.ringing { border-color: var(--danger); }
  .cd-card .cd-row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cd-card .cd-name { flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cd-card .cd-edit-btn { width: 40px; height: 40px; margin: -8px -6px -8px 0; border-radius: 10px; font-size: 15px; flex: 0 0 auto; }
  .cd-card .cd-state {
    flex: 0 0 auto; font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--glass-2); color: var(--ink-dim);
  }
  .cd-card .cd-state.ringing { background: rgba(255,122,122,.2); color: var(--danger); }
  .cd-card .cd-time {
    font-size: 30px; font-weight: 600; line-height: 1.15; margin: 2px 0 6px;
    font-variant-numeric: tabular-nums; letter-spacing: .5px;
  }
  .cd-card.paused .cd-time { opacity: .55; }
  .cd-bar { height: 4px; border-radius: 2px; background: var(--glass-2); overflow: hidden; }
  .cd-bar > i { display: block; height: 100%; border-radius: 2px; background: var(--accent); transition: width .5s linear; }
  .cd-card.paused .cd-bar > i { background: var(--ink-dim); }
  .cd-card .cd-acts { display: flex; gap: 8px; margin-top: 10px; }
  .cd-card .cd-acts button {
    flex: 1; min-height: 44px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--glass-2); color: var(--ink);
    font-size: 13px; touch-action: manipulation;
    transition: background .15s ease, color .15s ease;
  }
  .cd-card .cd-acts button:active { transform: scale(.96); }
  .cd-card .cd-acts .danger { color: var(--danger); }
  .cd-card .cd-acts .danger.armed { background: rgba(255,122,122,.22); border-color: var(--danger); }

  /* ---- 表单 ---- */
  .cd-form { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
  .cd-form-title { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .cd-input {
    width: 100%; min-height: 46px; padding: 0 14px; font-size: 15px;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--glass); color: var(--ink); outline: none;
    -webkit-appearance: none; appearance: none;
  }
  .cd-input:focus { border-color: var(--accent); }
  .cd-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
  /* .cd-chips 声明了 display:flex，会盖掉 UA 的 [hidden]{display:none} —— 必须显式兜底
     （「方向」那一行在「淡入 / 无」这类没有方向的家族下要整行收起来） */
  .cd-chips[hidden] { display: none !important; }
  .cd-chips button {
    min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    font-size: 13px; touch-action: manipulation;
  }
  .cd-chips button.active { border-color: var(--accent); background: var(--glass-2); color: var(--ink); }
  .cd-chips button:active { transform: scale(.95); }
  .cd-units { display: flex; gap: 8px; }
  .cd-unit { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cd-unit-val { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .cd-unit-btns { display: flex; gap: 6px; width: 100%; }
  .cd-unit-btns button {
    flex: 1; min-height: 44px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    font-size: 18px; line-height: 1; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .cd-unit-btns button:active { background: var(--glass-2); transform: scale(.94); }
  .cd-unit-label { font-size: 11px; color: var(--ink-dim); }
  .cd-total { text-align: center; font-size: 12px; color: var(--ink-dim); margin-top: 10px; font-variant-numeric: tabular-nums; }
  .cd-total.warn { color: var(--danger); }
  .cd-form-acts { display: flex; gap: 10px; margin-top: 14px; }
  .cd-form-acts button {
    flex: 1; min-height: 48px; border-radius: 14px; cursor: pointer;
    font-size: 15px; font-weight: 500; touch-action: manipulation;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
  }
  .cd-form-acts button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cd-form-acts button:active { transform: scale(.97); }
  .cd-form-acts button[disabled] { opacity: .5; }
  .cd-err { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 8px; }

  /* ---- 提示音设置（存在手机本地，与桌面端完全独立）---- */
  .cd-head-acts { display: flex; align-items: center; gap: 4px; }
  .cd-sound-kind {
    min-height: 44px; padding: 0 12px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--glass); color: var(--ink);
    font-size: 12px; font-weight: 500; touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .cd-sound-kind:active { transform: scale(.95); }
  .cd-sound-kind.off { opacity: .45; }
  .cd-sound-kind.playing { border-color: var(--accent); }
  #cd-sound-btn { font-size: 17px; }
  #cd-sound-btn.off { opacity: .5; }

  /* ---- 到点提醒条：给「响一小段 + 持续震动」一个看得见的落点 ---- */
  #cd-alert {
    position: fixed; z-index: 60;
    /* ⚠️ 必须让开顶部那颗倒计时胶囊（top:14 + 44 高 = 14~58）。
       提醒条是左右 12px 的整条横幅，盖在胶囊上 → 「提醒中」的 90 秒里用户点不到胶囊、
       进不了全屏，也就看不到全屏专属的「到点掠屏」（实机探针踩到过）。
       66px = 14 + 44 + 8 的间隙：两者上下叠着，都看得见、都点得到。 */
    top: calc(env(safe-area-inset-top, 0px) + 66px);
    left: 12px; right: 12px;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 16px; border-radius: 16px;
    background: var(--sheet); border: 1px solid var(--danger);
    box-shadow: 0 12px 34px rgba(0,0,0,.4);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transform: translateY(-160%); opacity: 0;
    transition: transform .28s cubic-bezier(.22,.8,.3,1), opacity .22s ease;
    pointer-events: none;
  }
  body.is-day #cd-alert { box-shadow: 0 12px 30px rgba(0,0,0,.14); }
  #cd-alert.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
  #cd-alert.hidden { display: none; }
  #cd-alert .cd-alert-icon { flex: 0 0 auto; font-size: 19px; }
  #cd-alert .cd-alert-txt { flex: 1 1 auto; min-width: 0; }
  #cd-alert .cd-alert-txt b {
    display: block; font-size: 14px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #cd-alert .cd-alert-txt span { display: block; font-size: 12px; color: var(--ink-dim); margin-top: 1px; }
  #cd-alert button {
    flex: 0 0 auto; min-height: 44px; padding: 0 16px; border-radius: 12px; cursor: pointer;
    border: none; background: var(--accent); color: #fff;
    font-size: 14px; font-weight: 500; touch-action: manipulation;
  }
  #cd-alert button:active { transform: scale(.96); }

  #cd-fab.hidden-fab { display: none; }
  /* 出全屏的形变动画期间：胶囊先隐身（无过渡，立刻让位），
     等形变层缩到它头上再淡入 —— 否则会「目标位置已经站着一颗胶囊，另一颗缩小过来重叠」。 */
  #cd-fab.fab-veil { opacity: 0; transition: none; }
  /* 抓手 / 标题栏用于下滑关闭，必须吃掉浏览器的滚动与回弹手势；内容区照常滚动 */
  #cd-grab, #cd-sheet .cd-head, .ui-grab, #ui-sheet .cd-head { touch-action: none; }
  /* hidden 属性兜底（这里几条规则声明了 flex，会盖掉 UA 的 [hidden]{display:none}） */
  #cd-form[hidden], #cd-empty[hidden], #cd-readonly[hidden] { display: none !important; }

  /* ====== [v1.0.5.7] 全屏倒计时（仅手机端）======
     左右两半：左边橙色、右边白/黑，橙色宽度 = 剩余比例（LTR 铺开）。
     底部一行两端对齐：左端大数字（与桌面时钟同一套动画）、右端两个大按钮（暂停/继续 · 取消）；
     顶部居中是显示「当前时间」的胶囊（点它回时钟）。
     z-index 40：盖住时钟与倒计时胶囊，但仍低于到点提醒条（60）。 */
  #fs-view {
    position: fixed; inset: 0; z-index: 40;
    background: var(--page); color: #fff;
    overflow: hidden; touch-action: manipulation;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .22s ease, visibility .22s;
    /* 水位条的渐变两端（夜/昼各一套）默认给橙色；用户调色时由 fsApplyAccent()
       按色相重新算成 hsl() 写到行内，覆盖这里的默认值 */
    --fs-a: #ea580c; --fs-b: #f97316;
    --fs-da: #fb923c; --fs-db: #fdba74;
  }
  body.is-day #fs-view { color: #14161c; }
  #fs-view.show { opacity: 1; visibility: visible; pointer-events: auto; }

  /* 水位条那一半：宽度由 JS 每秒推进一次，transition 线性 → 像水位在退。
     颜色不再是写死的橙：夜间用深一档、日间用亮一档（两套都由同一个色相算出来），
     CSS 只认 --fs-a/--fs-b（夜）与 --fs-da/--fs-db（昼）四个变量。 */
  #fs-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(90deg, var(--fs-a), var(--fs-b));
    transition: width 1s linear;
  }
  body.is-day #fs-fill { background: linear-gradient(90deg, var(--fs-da), var(--fs-db)); }
  #fs-fill.snap { transition: none; } /* 打开 / 切换对象时直接就位，别从 0 长出来 */

  /* [v1.0.5.7] 到点扫描：一条竖直的「浅—深—浅」色块，从左往右不断掠过整屏
     （单向 x 递增：移出右边界后立刻从左边重新开始），直到这条倒计时被关掉。
     颜色由 fsApplySweep() 写行内 —— 默认红；若用户把水位条本身调成了红，
     就换成反差色绿，否则会和背景糊成一片。宽度 = 屏宽的 26%（JS 侧的 FS_SWEEP_W）。 */
  #fs-sweep {
    position: absolute; top: 0; bottom: 0; left: 0; width: 26%;
    pointer-events: none; opacity: 0; will-change: transform;
  }
  #fs-view.rung #fs-sweep { opacity: 1; animation: fsSweep 1.7s linear infinite; }
  @keyframes fsSweep {
    from { transform: translateX(-100%); } /* 整个色块在屏幕左边界之外 */
    to   { transform: translateX(100vw); } /* 左边缘推到右边界之外 → 完全离开视野 */
  }

  /* [v1.0.5.7] 形变层：点胶囊进 / 出全屏时，一块「和背景一模一样」的画面从「胶囊矩形」
     长大到「整屏」（反过来就是缩回胶囊），像在手机上点开一个 app 图标。
     注意：它**不是纯色块**，而是真实背景的预览 —— 底色（var(--page)）+ 同一条水位条
     （同一个百分比、同一套 --fs-* 变量）。所以长到整屏时与 #fs-view 的画面**逐像素一致**，
     可以直接切过去（不必淡出；「淡出一个白块」正是看起来假的原因）。
     形状用 left/top/width/height/border-radius 过渡：元素只有一个、一辈子动两次，
     这点主线程开销换来的「圆角胶囊 → 直角整屏」比 transform 更自然。
     z-index 45：盖住全屏（40），但低于字号面板（50）与到点提醒条（60）。 */
  #fs-morph {
    position: fixed; z-index: 45; left: 0; top: 0; width: 0; height: 0;
    border-radius: 999px; overflow: hidden; /* 圆角期间水位条不能溢出 */
    background: var(--page);
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  /* 水位条：与 #fs-view 里那条同源（同百分比、同变量），出全屏时也是从这里开始缩 */
  #fs-morph-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: linear-gradient(90deg, var(--fs-a), var(--fs-b));
  }
  body.is-day #fs-morph-fill { background: linear-gradient(90deg, var(--fs-da), var(--fs-db)); }
  /* 进全屏时 #fs-view **整层**都还没 .show（opacity:0 + visibility:hidden）→ 内容自然看不见，
     不必再单独藏一遍。「形变铺满 → 空等 0.8s（时钟原样露着）→ 切换界面（整层淡入）」由 JS 驱动。 */

  /* 底部一行：左端大数字、右端两个大按钮 —— 两端对齐，谁都不会越界。
     容器本身不吃事件（pointer-events:none），只有数字与按钮各自吃，免得挡住整条底边。 */
  .fs-bottom {
    position: absolute; left: 0; right: 0;
    /* 28px 起算：离屏幕底边太近会被 Android 手势导航/上滑返回抢触摸，
       留出安全距离后按钮的按下手势能完整落到页面上。 */
    bottom: calc(28px + env(safe-area-inset-bottom) + var(--fs-lift, 0px));
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px; padding: 0 16px;
    pointer-events: none;
    /* --fs-lift：全屏里弹出字号面板时，把整条底边上抬「面板高度」，让用户边调边看。
       opacity / transform 的过渡留给内容的淡入与位移用。 */
    transition: bottom .24s cubic-bezier(.32,1.02,.4,1),
                opacity .26s ease,
                transform .32s cubic-bezier(.32,1.02,.4,1);
  }
  .fs-left {
    flex: 0 1 auto; min-width: 0;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  }
  /* 大数字：DOM 结构与「动画类」都跟桌面 #clock 同源（.digit-group/.digit-current/.digit-next
     + anim-<家族> dir-<方向>），所以电脑上选的动画在手机上完全一致。
     字号不写死 —— 由 fsFit() 按「可用宽度」（已扣掉右侧按钮）算出来，保证不超出边界。 */
  #fs-time {
    display: inline-flex; align-items: center; gap: .06em;
    font-size: 96px; /* 占位值，JS 会覆盖；写小一点免得首帧闪一下 */
    font-weight: 700; line-height: 1; letter-spacing: .01em;
    white-space: nowrap; font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 20px rgba(0,0,0,.32), 0 1px 2px rgba(0,0,0,.22);
    pointer-events: auto; /* 长按数字也要能调字号 */
    touch-action: manipulation;
  }
  body.is-day #fs-time { text-shadow: 0 2px 18px rgba(255,255,255,.55); }
  #fs-time .colon { opacity: .85; }
  /* 操作失败时的一行小字（成功路径不打扰） */
  #fs-msg {
    font-size: 13px; font-weight: 500; color: #fecaca;
    opacity: 0; transition: opacity .2s ease; pointer-events: none;
  }
  body.is-day #fs-msg { color: #b91c1c; }
  #fs-msg.show { opacity: 1; }
  /* 右下角两个大按钮：左 = 暂停/继续，右 = 取消（二次确认）。按钮里**不放文字**，
     图形全部用纯 CSS 画（不依赖字体/图标库），颜色跟 currentColor 走 → 昼夜自动适配。 */
  #fs-acts { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; pointer-events: auto; }
  #fs-acts[hidden] { display: none !important; }
  #fs-acts button {
    position: relative; z-index: 1; /* 稳稳压在最上层：命中测试里不能被同层元素抢走 */
    width: 68px; height: 68px; padding: 0; border-radius: 22px; border: 1px solid var(--line);
    background: rgba(10,12,17,.5); color: #fff;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; touch-action: manipulation;
    transition: transform .16s cubic-bezier(.34,1.4,.64,1), background .16s ease, opacity .16s ease;
  }
  body.is-day #fs-acts button { background: rgba(255,255,255,.78); color: #14161c; border-color: rgba(0,0,0,.12); }
  #fs-acts button:active { transform: scale(.93); }
  #fs-acts button[disabled] { opacity: .45; pointer-events: none; }
  #fs-acts button.armed { background: #dc2626; color: #fff; border-color: transparent; }

  /* ---- 纯 CSS 图形：默认都不画，由按钮状态决定显示哪一个 ---- */
  .ico { box-sizing: border-box; pointer-events: none; } /* 纯装饰：不吃指针事件，落点永远落在按钮上 */
  /* 暂停 = 两条竖条 */
  .ico-pause { display: none; width: 21px; height: 26px; gap: 6px; }
  .ico-pause::before, .ico-pause::after { content: ''; flex: 1 1 auto; border-radius: 2.5px; background: currentColor; }
  /* 继续 = 一个实心三角（clip-path 比 border 三角更好控形状，移动端全支持） */
  .ico-play {
    display: none; width: 22px; height: 26px; margin-left: 3px;
    background: currentColor; border-radius: 3px;
    clip-path: polygon(8% 0%, 100% 50%, 8% 100%);
  }
  /* 取消 = 一个 ✕（两条 45° 斜线） */
  .ico-x { display: none; position: relative; width: 23px; height: 23px; }
  .ico-x::before, .ico-x::after {
    content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 3px;
    border-radius: 2px; background: currentColor;
  }
  .ico-x::before { transform: translateY(-50%) rotate(45deg); }
  .ico-x::after { transform: translateY(-50%) rotate(-45deg); }
  /* 确认态 = 一个「?」（同样纯 CSS 画）：取消按第一下不是「打勾确认了」，
     而是在**问你**要不要删（再点一下才真删）—— 问号才符合这个语义。
     问号 = 缺左下角的圆环（钩）+ 一竖 + 底下一点。 */
  .ico-q { display: none; position: relative; width: 24px; height: 27px; }
  .ico-q::before {
    content: ''; position: absolute; left: 5px; top: 0;
    width: 14px; height: 14px; box-sizing: border-box;
    border: 3px solid currentColor; border-radius: 50%;
    /* 只留上、右两条边 → 从 9 点经 12 点到 6 点的那段弧，正是问号的钩 */
    border-left-color: transparent; border-bottom-color: transparent;
  }
  .ico-q::after { /* 竖干（钩的末端往下延） */
    content: ''; position: absolute; left: 50%; top: 13px;
    width: 3.6px; height: 7px; margin-left: -1.8px;
    border-radius: 2px; background: currentColor;
  }
  .ico-q .ico-q-dot { /* 底下那一点 */
    position: absolute; left: 50%; top: 23px;
    width: 4px; height: 4px; margin-left: -2px;
    border-radius: 50%; background: currentColor;
  }
  /* 状态 → 图形 的唯一映射（data-act / .armed 是唯一事实来源，都只由 fsPaintActs 维护） */
  #fs-toggle[data-act="pause"] .ico-pause { display: flex; }
  #fs-toggle[data-act="resume"] .ico-play { display: block; }
  #fs-cancel:not(.armed) .ico-x { display: block; }
  #fs-cancel.armed .ico-q { display: block; }

  #fs-name {
    font-size: 15px; font-weight: 500; letter-spacing: .3px; opacity: .82;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  body.is-day #fs-name { opacity: .66; }

  /* 全屏里显示「当前时间」的胶囊：点一下回时钟。没有动画（跟随桌面设置决定带不带秒）。
     放在**顶部居中**，把整条底边让给左端数字与右端按钮，三者互不打架。 */
  #fs-pill {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center;
    min-height: 44px; padding: 0 18px;
    border-radius: 999px; border: 1px solid var(--line);
    background: rgba(10,12,17,.55); color: #fff;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
    cursor: pointer; touch-action: manipulation;
    transition: transform .18s cubic-bezier(.34,1.4,.64,1), opacity .26s ease;
  }
  body.is-day #fs-pill {
    background: rgba(255,255,255,.8); color: #14161c; border-color: rgba(0,0,0,.12);
  }
  #fs-pill:active { transform: translateX(-50%) scale(.94); }
  /* 全屏里这颗时钟胶囊同样 3 秒没操作就淡出（全屏是「看大字」的场景，别长期挡着）；
     屏幕上任何一次操作立刻唤回来。规则与底部倒计时胶囊一致，只是作用对象不同。 */
  #fs-pill.idle {
    opacity: 0; visibility: hidden; pointer-events: none;
    transform: translateX(-50%) translateY(-140%) scale(.96);
    transition: opacity .3s ease, visibility .3s, transform .34s cubic-bezier(.4,0,.2,1);
  }

  /* 全屏里长按数字要能弹出字号面板 → 面板必须压在全屏（40）之上、提醒条（60）之下 */
  #ui-sheet, #ui-scrim { z-index: 50; }

  @media (prefers-reduced-motion: reduce) {
    #cd-sheet, #cd-scrim, #ui-sheet, #ui-scrim, #hint, #cd-fab, #cd-alert, #fs-view, #fs-fill,
    #fs-pill, #fs-time .digit-current, #fs-time .digit-next, #fs-acts button,
    #fs-sweep, #fs-morph, .fs-bottom,
    .cd-card, .cd-card .cd-acts button,
    .cd-chips button, .cd-unit-btns button, .cd-form-acts button,
    .ui-stepper button, .ui-acts button { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="clock" class="anim-flip dir-up">
  <div id="time-display"><span id="digits"></span></div>
  <div id="info-bar" class="info-bar"></div>
</div>
<div id="ampm"></div>
<div id="foot"><span id="dot" class="dot off"></span><span id="status">连接中…</span></div>

<!-- ====== [v1.0.5.7] 倒计时：底部胶囊入口 + 上拉抽屉（触控优先，全部自包含） ====== -->
<button id="cd-fab" class="hidden-fab" type="button" aria-label="倒计时" aria-haspopup="dialog">
  <span aria-hidden="true">⏳</span><span id="cd-fab-text">倒计时</span>
</button>

<!-- 手势的发现性：首次进页面提示一次，8 秒后自己消失 -->
<div id="hint" hidden>双击时钟可调整字号</div>

<div id="ui-scrim"></div>

<!-- 双击时钟 / 双击全屏大数字弹出的面板：手机端自己的显示设置 + 倒计时入口 -->
<!-- ⚠️ 没有倒计时时胶囊会完全隐藏，所以「新建倒计时」必须在这里留一个入口 -->
<section id="ui-sheet" role="dialog" aria-modal="true" aria-labelledby="ui-title">
  <div class="cd-grab" aria-hidden="true"></div>
  <div class="cd-head">
    <h2 id="ui-title">手机端显示</h2>
    <button class="cd-icon-btn" id="ui-close" type="button" aria-label="关闭">✕</button>
  </div>
  <div class="cd-body">
    <div class="ui-row">
      <span class="ui-row-label" id="ui-scale-label">时钟大小</span>
      <div class="ui-stepper">
        <button type="button" id="ui-minus" aria-label="缩小">−</button>
        <span class="ui-val" id="ui-scale-val">100%</span>
        <button type="button" id="ui-plus" aria-label="放大">+</button>
      </div>
    </div>
    <div class="ui-scale-bar"><div class="ui-track"><div class="ui-fill" id="ui-fill"></div></div></div>
    <div class="ui-hint" id="ui-scale-hint">只影响这台手机，与电脑上的显示设置无关。</div>

    <!-- 主界面时钟专属：字体与数字动画都存**这台手机**
         （与电脑端设置相互独立；面板里两处都点了「跟随电脑」才回到跟电脑一致） -->
    <div class="ui-block" id="ui-clock-block">
      <div class="ui-row">
        <span class="ui-row-label" id="ui-font-label">字体</span>
      </div>
      <div class="cd-chips" id="ui-font-chips"></div>
      <div class="ui-font-custom" id="ui-font-custom" hidden>
        <input id="ui-font-input" type="text" maxlength="40" autocomplete="off" spellcheck="false"
               placeholder="字体名，如 微软雅黑" aria-label="自定义字体名" />
        <button type="button" id="ui-font-ok" class="ui-mini">确定</button>
      </div>

      <div class="ui-row">
        <span class="ui-row-label" id="ui-anim-label">数字动画</span>
      </div>
      <div class="cd-chips" id="ui-anim-chips"></div>
      <div class="cd-chips" id="ui-dir-chips"></div>

      <div class="ui-row">
        <span class="ui-row-label" id="ui-ease-label">动画节奏</span>
      </div>
      <!-- [v1.0.5.7] 缓动曲线（匀速 / 慢起 / 慢停 / 两头慢）；「弹性」= 各动画各自的原有曲线 -->
      <div class="cd-chips" id="ui-ease-chips"></div>

      <div class="ui-row">
        <span class="ui-row-label" id="ui-dur-label">动画时长</span>
        <div class="ui-stepper">
          <button type="button" id="ui-dur-minus" aria-label="缩短">−</button>
          <span class="ui-val" id="ui-dur-val">350ms</span>
          <button type="button" id="ui-dur-plus" aria-label="延长">+</button>
        </div>
      </div>
      <div class="ui-hint" id="ui-anim-hint">只影响这台手机，与电脑上的设置无关。</div>
    </div>

    <!-- [v1.0.5.7] 全屏倒计时专属：只在双击「全屏大数字」进来的面板里出现 -->
    <div class="ui-block" id="ui-fs-block" hidden>
      <div class="ui-row">
        <span class="ui-row-label" id="ui-blur-label">模糊数字</span>
        <button type="button" id="ui-blur" class="ui-switch" role="switch" aria-checked="false"
                aria-label="模糊数字"><span class="ui-knob" aria-hidden="true"></span></button>
      </div>
      <div class="ui-hint" id="ui-blur-hint">5 秒无操作、且剩余时间超过 1 分钟时，秒数显示为 --</div>

      <div class="ui-row">
        <span class="ui-row-label" id="ui-accent-label">背景色</span>
        <button type="button" id="ui-accent-reset" class="ui-mini">默认</button>
      </div>
      <div class="ui-hue" id="ui-hue" role="slider" tabindex="0"
           aria-valuemin="0" aria-valuemax="359" aria-valuenow="24" aria-label="背景色">
        <div class="ui-hue-track" id="ui-hue-track" aria-hidden="true"></div>
        <div class="ui-hue-knob" id="ui-hue-knob" aria-hidden="true"></div>
      </div>
    </div>

    <div class="ui-acts">
      <button type="button" id="ui-reset">恢复默认</button>
      <button type="button" class="primary" id="ui-new-cd">新建倒计时</button>
    </div>
  </div>
</section>

<div id="cd-scrim"></div>

<!-- ====== [v1.0.5.7] 全屏倒计时（仅手机端）：单击胶囊进入，点底部时钟胶囊返回 ====== -->
<section id="fs-view" role="dialog" aria-modal="true" aria-labelledby="fs-name" aria-hidden="true">
  <div id="fs-fill" aria-hidden="true"></div>
  <div id="fs-sweep" aria-hidden="true"></div>
  <button id="fs-pill" type="button" aria-label="返回时钟">
    <span id="fs-pill-time">00:00</span>
  </button>
  <div class="fs-bottom">
    <div class="fs-left">
      <div id="fs-name">倒计时</div>
      <div id="fs-time" class="anim-flip dir-up">00:00</div>
      <div id="fs-msg" role="status" aria-live="polite"></div>
    </div>
    <div id="fs-acts">
      <!-- 图形用纯 CSS 画（见下方 .ico-* 规则），不写文字：
           data-act 决定显示哪个图形（pause → 两条竖条；resume → 三角），
           语义交给 aria-label，语言切换时由 fsPaintActs 跟着换。 -->
      <button id="fs-toggle" type="button" data-act="pause" aria-label="暂停">
        <span class="ico ico-pause" aria-hidden="true"></span>
        <span class="ico ico-play" aria-hidden="true"></span>

</section>

<!-- [v1.0.5.7] 进出全屏的形变层：从胶囊矩形长大到整屏（反向就是缩回胶囊）。

     纯装饰，事件一律穿透；样式见 #fs-morph / #fs-morph-fill。 -->
<div id="fs-morph" aria-hidden="true"><div id="fs-morph-fill" aria-hidden="true"></div></div>

<!-- 到点提醒条：声音只响一小段，震动持续到用户处理（或 90 秒后自动收起） -->
<div id="cd-alert" class="hidden" role="alert" aria-live="assertive">
  <span class="cd-alert-icon" aria-hidden="true">⏰</span>
  <div class="cd-alert-txt">
    <b id="cd-alert-name">倒计时</b>
    <span id="cd-alert-sub">时间到了</span>
  </div>
  <button id="cd-alert-stop" type="button">知道了</button>
</div>

<section id="cd-sheet" role="dialog" aria-modal="true" aria-labelledby="cd-title">
  <div class="cd-grab" id="cd-grab" aria-hidden="true"></div>
  <div class="cd-head">
    <h2 id="cd-title">倒计时</h2>
    <div class="cd-head-acts">
      <button class="cd-sound-kind" id="cd-sound-kind" type="button" aria-label="提示音音色">beep</button>
      <button class="cd-icon-btn" id="cd-sound-btn" type="button" aria-pressed="true" aria-label="提示音">🔔</button>
      <button class="cd-icon-btn" id="cd-close" type="button" aria-label="关闭">✕</button>
    </div>
  </div>
  <div class="cd-body" id="cd-body">
    <div id="cd-list"></div>
    <div class="cd-empty" id="cd-empty" hidden></div>
    <div class="cd-empty" id="cd-readonly" hidden></div>

    <form class="cd-form" id="cd-form" autocomplete="off" novalidate>
      <div class="cd-form-title" id="cd-form-title">新建倒计时</div>
      <input class="cd-input" id="cd-name" type="text" maxlength="40" placeholder="名称（可选）"
             aria-label="倒计时名称" enterkeyhint="done">

          <div class="cd-unit-label">时</div>
        </div>
        <div class="cd-unit">
          <div class="cd-unit-val" id="cd-unit-m">5</div>
          <div class="cd-unit-btns">
            <button type="button" data-unit="m" data-delta="-1" aria-label="分钟减一">−</button>
            <button type="button" data-unit="m" data-delta="1" aria-label="分钟加一">+</button>
          </div>
          <div class="cd-unit-label">分</div>
        </div>
        <div class="cd-unit">
          <div class="cd-unit-val" id="cd-unit-s">0</div>
          <div class="cd-unit-btns">
            <button type="button" data-unit="s" data-delta="-1" aria-label="秒减一">−</button>
            <button type="button" data-unit="s" data-delta="1" aria-label="秒加一">+</button>
