<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<title>Digital Clock</title>
<style>
  /* 手机端镜像页：完全自包含（内联样式与脚本、零外部资源），断网也能打开。
     颜色 / 字号 / 12-24 小时制 / 时区 / 昼夜自动配色 / 动画家族与方向都跟随桌面配置；
     访问码来自地址栏路径，页面自身不拼任何外部地址。 */
  :root { --anim-duration: 350ms; --dim: rgba(255,255,255,.45); --page: #0a0c11; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--page); color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    transition: background .5s ease, color .5s ease;
  }
  body::before {
    content: ""; position: fixed; inset: -25%; pointer-events: none;
    background:
      radial-gradient(55% 45% at 50% 28%, rgba(120,150,255,.16), transparent 72%),
      radial-gradient(50% 40% at 72% 82%, rgba(255,120,180,.10), transparent 72%);
    transition: opacity .5s ease;
  }
  body.is-day { --page: #eef1f6; --dim: rgba(0,0,0,.42); color: #111; }
  body.is-day::before { opacity: .35; }

  #clock {
    position: relative; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(4px, 1.4vh, 14px); max-width: 100%;
  }
  #clock.date-above { flex-direction: column-reverse; }

  #time-display {
    position: relative; display: flex; align-items: center; justify-content: center;
    padding: .04em .1em; border-radius: .05em; line-height: 1;
    transition: color .5s ease, background-color .5s ease;
  }
  #digits { display: inline-flex; align-items: center; gap: .06em; line-height: 1; white-space: nowrap; }

  /* ====== 数字位 / 动画：与桌面 styles.css 同源，保证观感一致 ====== */
  .digit-group {
    position: relative; display: inline-block; height: 1.1em; overflow: hidden;
    vertical-align: middle; font-variant-numeric: tabular-nums;
  }
  .digit-current { display: block; line-height: 1.1em; height: 1.1em; text-align: center; will-change: transform, opacity; }
  .digit-current.animate-out {
    transform: translateY(-100%); opacity: 0;
    transition: transform var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1), opacity var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1);
  }
  .digit-next {
    position: absolute; top: 0; left: 0; width: 100%; height: 1.1em; line-height: 1.1em;
    text-align: center; transform: translateY(100%); opacity: 0; will-change: transform, opacity;
  }
  .digit-next.animate-in {
    transform: translateY(0); opacity: 1;
    transition: transform var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1), opacity var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1);
  }
  .anim-flip.dir-down .digit-next { transform: translateY(-100%); }
  .anim-flip.dir-down .digit-current.animate-out {
    transform: translateY(100%); opacity: 0;
    transition: transform var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1), opacity var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1);
  }
  .anim-flip.dir-down .digit-next.animate-in { transform: translateY(0); opacity: 1; }
  .anim-fade .digit-next { transform: none; }
  .anim-fade .digit-current.animate-out { transform: none; opacity: 0; transition: opacity var(--anim-duration,350ms) ease; }
  .anim-fade .digit-next.animate-in { transform: none; opacity: 1; transition: opacity var(--anim-duration,350ms) ease; }
  .anim-scale.dir-shrink .digit-current.animate-out {
    transform: scale(.3); opacity: 0;
    transition: transform var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1), opacity var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1);
  }
  .anim-scale.dir-shrink .digit-next { transform: none; }
  .anim-scale.dir-shrink .digit-next.animate-in { transform: none; opacity: 1; transition: opacity var(--anim-duration,350ms) ease; }
  .anim-scale.dir-grow .digit-current.animate-out {
    transform: scale(1.5); opacity: 0;
    transition: transform var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1), opacity var(--anim-duration,350ms) cubic-bezier(.34,1.56,.64,1);
  }
  .anim-scale.dir-grow .digit-next { transform: none; }
  .anim-scale.dir-grow .digit-next.animate-in { transform: none; opacity: 1; transition: opacity var(--anim-duration,350ms) ease; }
  .anim-flip-3d .digit-group { perspective: 400px; }
  .anim-flip-3d .digit-current { transform-origin: bottom center; backface-visibility: hidden; }
  .anim-flip-3d .digit-next { transform-origin: top center; backface-visibility: hidden; transform: rotateX(-90deg); opacity: 0; }
  .anim-flip-3d .digit-current.animate-out {
    transform: rotateX(90deg); opacity: 0;
    transition: transform var(--anim-duration,350ms) ease-in, opacity var(--anim-duration,350ms) ease-in;
  }
  .anim-flip-3d .digit-next.animate-in {
    transform: rotateX(0deg); opacity: 1;
    transition: transform var(--anim-duration,350ms) ease-out, opacity var(--anim-duration,350ms) ease-out;
  }
  .colon {
    display: inline-flex; align-items: center; justify-content: center;
    vertical-align: middle; margin: 0 .02em; animation: breathe 1s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

  /* ====== 信息栏 ====== */
  .info-bar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: .5em 1em; padding: .06em .3em; border-radius: .06em;
    opacity: .92; line-height: 1.3;
    transition: color .5s ease, background-color .5s ease;
  }
  .info-bar:empty { display: none; }

  /* ====== AM / PM 角标：手机端钉在屏幕角上，避免压住数字 ====== */
  #ampm {
    position: fixed; line-height: 1; font-weight: 500; letter-spacing: .5px;
    opacity: .7; pointer-events: none; display: none;
  }
  #ampm.show { display: block; }
  #ampm.top-left { top: calc(14px + env(safe-area-inset-top)); left: 16px; }
  #ampm.top-right { top: calc(14px + env(safe-area-inset-top)); right: 16px; }
  #ampm.bottom-left { bottom: calc(30px + env(safe-area-inset-bottom)); left: 16px; }
  #ampm.bottom-right { bottom: calc(30px + env(safe-area-inset-bottom)); right: 16px; }

  /* ====== 底部状态 ====== */
  #foot {
    position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 11px; color: var(--dim); letter-spacing: .3px; pointer-events: none;
  }
  .dot {
    width: 6px; height: 6px; border-radius: 50%; background: #3ac569;
    box-shadow: 0 0 8px rgba(58,197,105,.85); transition: background .3s ease, box-shadow .3s ease;
  }
  .dot.off { background: #e0685a; box-shadow: 0 0 8px rgba(224,104,90,.85); }
</style>
</head>
<body>
<div id="clock" class="anim-flip dir-up">
  <div id="time-display"><span id="digits"></span></div>
  <div id="info-bar" class="info-bar"></div>
</div>
<div id="ampm"></div>
<div id="foot"><span id="dot" class="dot off"></span><span id="status">连接中…</span></div>

<script>
(function () {
  'use strict';

  // 与主进程约定的路径；访问码直接取自地址栏，页面不拼任何外部地址
  var API_TAIL = '/api/state';
  var POLL_MS = 15000;

  // 拿不到快照时的兜底配置：保证页面一打开就有钟走，而不是空白
  var FALLBACK = {
    language: 'zh', color: '#ffffff', bgColor: 'rgba(0,0,0,0)', fontFamily: 'Arial',
    infoScale: 0.3, hourFormat: 'auto', ampmCorner: 'top-right',
    showSeconds: true, showDate: true, showWeekday: true, datePosition: 'below',
    autoColor: false, extraTimezones: [],
    animType: 'flip', animFlipDir: 'up', animScaleDir: 'shrink', animDuration: 350,
    staggerDelay: 0, staggerDirection: 'ltr',
    timeOffsetMs: 0, autoAdjustEnabled: false, autoAdjustIntervalSec: 3600,
    autoAdjustAmountMs: 0, autoAdjustBaseMs: 0, autoAdjustAnchor: 0
  };

  var CFG = FALLBACK;
  var SYNC_MS = 0;            // 服务端时间 - 本机时间（含半程网络延迟补偿）
  var haveRemote = false;
  var online = false, fails = 0;
  var lastKey = null, lastLen = 0, lastInfo = '', colorKey = '', lastAmpm = null;
  var ed = [], tickTimer = null;

  function el(id) { return document.getElementById(id); }
  function nm(v, d) { var n = Number(v); return isFinite(n) ? n : d; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function tokenPath() {
    // 「不需要访问码」模式下页面就在根路径 /，第一段是空的 →
    // 必须拼成 /api/state 而不是 //api/state（双斜杠会被当成协议相对 URL，主机名变成 api）
    var seg = location.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '';
    return (seg ? '/' + seg : '') + API_TAIL;
  }

  // ====== 时间：与 renderer.js 同源（手动校准 + 定时自动校准的阶梯累积） ======
  function use12() {
    var f = CFG.hourFormat || '24';
    if (f === '12') return true;
    if (f === '24') return false;
    try {
      var o = new Intl.DateTimeFormat(undefined, { hour: 'numeric' }).resolvedOptions();
      if (o.hourCycle) return o.hourCycle === 'h11' || o.hourCycle === 'h12';
    } catch (e) { /* ignore */ }
    return false;
  }
  function ampmLabel(h24) { return CFG.language === 'zh' ? (h24 >= 12 ? '下午' : '上午') : (h24 >= 12 ? 'PM' : 'AM'); }
  function clampAuto(v) { return Math.max(-3600000, Math.min(3600000, v)); }
  function autoDelta(nowMs) {
    if (!CFG.autoAdjustEnabled) return 0;
    var iv = Math.max(5, nm(CFG.autoAdjustIntervalSec, 5)) * 1000;
    var am = nm(CFG.autoAdjustAmountMs, 0);
    var bs = nm(CFG.autoAdjustBaseMs, 0);
    if (!am) return clampAuto(bs);
    var an = nm(CFG.autoAdjustAnchor, 0) || nowMs;
    var steps = Math.floor(Math.max(0, nowMs - an) / iv);
    return clampAuto(bs + steps * am);
  }
  function realNow() { return Date.now() + SYNC_MS; }
  function totalOffset() { return nm(CFG.timeOffsetMs, 0) + autoDelta(realNow()); }
  function effNow() { return new Date(realNow() + totalOffset()); }

  function digitsOf(d) {
    var h24 = d.getHours();
    var hh = pad(use12() ? (h24 % 12 || 12) : h24);
    var mm = pad(d.getMinutes());
    var ss = pad(d.getSeconds());
    return (CFG.showSeconds !== false ? hh + mm + ss : hh + mm).split('');
  }
  function fmtDate(d) {
    if (CFG.language === 'zh') return d.getFullYear() + '年' + pad(d.getMonth() + 1) + '月' + pad(d.getDate()) + '日';
    var M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return M[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }
  function weekdayOf(d) {
    try { return new Intl.DateTimeFormat(CFG.language === 'zh' ? 'zh-CN' : 'en-US', { weekday: 'long' }).format(d); }
    catch (e) { return ''; }
  }
  function tzText(d, offset) {
    var h24 = ((d.getUTCHours() + nm(offset, 0)) % 24 + 24) % 24;
    var mm = pad(d.getUTCMinutes());
    if (!use12()) return pad(h24) + ':' + mm;
    return pad(h24 % 12 || 12) + ':' + mm + ' ' + ampmLabel(h24);
  }

  // ====== 渲染 ======
  function build(dg) {
    var box = el('digits');
    box.innerHTML = '';
    var cc = Math.floor((dg.length - 1) / 2), ci = 0;
    for (var i = 0; i < dg.length; i++) {
      if (i > 0 && i % 2 === 0 && ci < cc) {
        var co = document.createElement('span');
        co.className = 'colon'; co.textContent = ':';
        box.appendChild(co); ci++;
      }
      var g = document.createElement('span'); g.className = 'digit-group';
      var a = document.createElement('span'); a.className = 'digit-current'; a.textContent = dg[i];
      var b = document.createElement('span'); b.className = 'digit-next'; b.textContent = dg[i];
      g.appendChild(a); g.appendChild(b); box.appendChild(g);
    }
    ed = dg.slice();
  }

  function resetPair(c, n) {
    c.style.transition = n.style.transition = 'none';
    c.classList.remove('animate-out'); n.classList.remove('animate-in');
    c.style.transform = c.style.opacity = n.style.transform = n.style.opacity = '';
    void c.offsetHeight;
    c.style.transition = n.style.transition = '';
  }

  function swap(dg) {
    var groups = el('digits').querySelectorAll('.digit-group');
    var sd = nm(CFG.staggerDelay, 0), rtl = CFG.staggerDirection === 'rtl';
    var AD = nm(CFG.animDuration, 350);
    for (var i = 0; i < dg.length; i++) {
      if (ed[i] === dg[i]) continue;
      var g = groups[i]; if (!g) continue;
      var ce = g.querySelector('.digit-current'), ne = g.querySelector('.digit-next');
      if (!ce || !ne) continue;
      var next = dg[i];
      ed[i] = next;
      var delay = sd > 0 ? sd * (rtl ? dg.length - 1 - i : i) : 0;
      if (CFG.animType === 'none') {
        (function (target, val, dl) {
          if (dl > 0) setTimeout(function () { target.textContent = val; }, dl);
          else target.textContent = val;
        })(ce, next, delay);
        continue;
      }
      (function (cur, nxt, val, dl) {
        var go = function () {
          resetPair(cur, nxt);
          nxt.textContent = val;
          cur.classList.add('animate-out');
          nxt.classList.add('animate-in');
          setTimeout(function () { cur.textContent = val; resetPair(cur, nxt); }, AD + 30);
        };
        if (dl > 0) setTimeout(go, dl); else go();
      })(ce, ne, next, delay);
    }
  }

  function renderInfo(now) {
    var bar = el('info-bar'), out = [];
    if (CFG.showDate !== false) out.push('<span>' + esc(fmtDate(now)) + '</span>');
    if (CFG.showWeekday !== false) out.push('<span>' + esc(weekdayOf(now)) + '</span>');
    var tz = (CFG.extraTimezones || []).slice(0, 2);
    for (var i = 0; i < tz.length; i++) {
      out.push('<span>' + esc((tz[i].label ? tz[i].label + ' ' : '') + tzText(now, tz[i].offset)) + '</span>');
    }
    var html = out.join('');
    if (html !== lastInfo) { bar.innerHTML = html; lastInfo = html; }
  }

  function applyColors(now) {
    var fg = CFG.color || '#ffffff';
    var bg = CFG.bgColor || 'rgba(0,0,0,0)';
    var day = false;
    if (CFG.autoColor) {
      var h = now.getHours();
      day = h >= 6 && h < 18;
      var a = 0, m = String(CFG.bgColor || '').match(/rgba\((\d+),\s*(\d+),\s*(\d+),\s*([\d.]+)\)/);
      if (m) a = parseFloat(m[4]);
      if (day) { fg = '#000000'; bg = 'rgba(255,255,255,' + a + ')'; }
      else { fg = '#ffffff'; bg = 'rgba(0,0,0,' + a + ')'; }
    }
    var key = fg + '|' + bg + '|' + day;
    if (key === colorKey) return;
    colorKey = key;
    el('time-display').style.color = fg;
    el('time-display').style.backgroundColor = bg;
    el('info-bar').style.color = fg;
    el('info-bar').style.backgroundColor = bg;
    document.body.classList.toggle('is-day', !!day);
  }

  function applyAmpm(text) {
    if (text === lastAmpm) return;
    lastAmpm = text;
    var node = el('ampm');
    var corner = CFG.ampmCorner || 'top-right';
    if (!text) { node.className = ''; node.textContent = ''; return; }
    node.textContent = text;
    node.className = 'show ' + corner;
    node.style.fontSize = Math.max(11, Math.min(30, Math.round(curPx * 0.18))) + 'px';
  }

  var curPx = 120;
  function fit() {
    var clock = el('clock'), digits = el('digits');
    var probe = 100;
    clock.style.fontSize = probe + 'px';
    var w = digits.getBoundingClientRect().width || 1;
    var avail = Math.max(140, window.innerWidth - 28);
    var px = probe * (avail / w);
    px = Math.max(30, Math.min(px, Math.round(window.innerHeight * 0.38), 460));
    clock.style.fontSize = px + 'px';
    curPx = px;
    el('info-bar').style.fontSize = Math.max(10, Math.min(38, Math.round(px * nm(CFG.infoScale, 0.3)))) + 'px';
    el('time-display').style.setProperty('--anim-duration', nm(CFG.animDuration, 350) + 'ms');
  }

  function applyStatic() {
    var clock = el('clock');
    var AT = ['flip', 'scale', 'fade', 'flip-3d', 'none'].indexOf(CFG.animType) >= 0 ? CFG.animType : 'flip';
    var dir = AT === 'flip' ? (CFG.animFlipDir === 'down' ? 'dir-down' : 'dir-up')
      : AT === 'scale' ? (CFG.animScaleDir === 'grow' ? 'dir-grow' : 'dir-shrink') : '';
    clock.className = 'anim-' + AT + (dir ? ' ' + dir : '') + (CFG.datePosition === 'above' ? ' date-above' : '');
    var ff = String(CFG.fontFamily || '').replace(/[^A-Za-z0-9 _-]/g, '').trim();
    document.body.style.fontFamily = (ff ? '"' + ff + '",' : '') +
      '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif';
  }

  function setStatus() {
    var zh = CFG.language !== 'en';
    el('status').textContent = online
      ? (zh ? '实时同步 · 只读' : 'Live · read-only')
      : (zh ? '连接断开，本地继续走时' : 'Disconnected — running locally');
    el('dot').className = online ? 'dot' : 'dot off';
  }

  // ====== 主循环：对齐秒边界（ms 级校准也生效） ======
  function schedule() {
    if (tickTimer) clearTimeout(tickTimer);
    var off = totalOffset();
    var ms = 1000 - (((Date.now() + SYNC_MS + off) % 1000) + 1000) % 1000;
    tickTimer = setTimeout(function () { tickTimer = null; tick(); }, ms + 1);
  }

  function tick() {
    var now = effNow();
    var dg = digitsOf(now);
    renderInfo(now);
    applyColors(now);
    applyAmpm(use12() ? ampmLabel(now.getHours()) : '');
    if (lastKey === null || lastLen !== dg.length) {
      build(dg);
      lastKey = dg.join('');
      lastLen = dg.length;
      fit();
    } else if (lastKey !== dg.join('')) {
      swap(dg);
      lastKey = dg.join('');
    }
    schedule();
  }

  // ====== 拉取快照 ======
  function pull() {
    var t0 = Date.now();
    var url = tokenPath();
    fetch(url, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
      .then(function (j) {
        var t1 = Date.now();
        SYNC_MS = nm(j.now, Date.now()) - (t0 + t1) / 2;
        var next = j.cfg || CFG;
        var changed = !haveRemote || JSON.stringify(next) !== JSON.stringify(CFG);
        CFG = next;
        haveRemote = true;
        online = true; fails = 0;
        if (changed) {
          applyStatic();
          lastKey = null; lastInfo = ''; colorKey = ''; lastAmpm = null;
        }
        setStatus();
      })
      .catch(function () {
        fails++;
        if (fails >= 2) { online = false; setStatus(); }
      });
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { pull(); schedule(); }
  });
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 120); });

  applyStatic();
  tick();
  setStatus();
  pull();
  setInterval(pull, POLL_MS);
})();
</script>
</body>
</html>
